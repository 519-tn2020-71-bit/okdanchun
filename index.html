<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>연광정의 북소리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Song+Myung&display=swap">
<style>
:root{
  color-scheme:dark;
  --ink:#1b1a17; --ink2:#3a2f22; --paper:#f1ead8; --paper2:#e5dac0; --line:#b9a987;
  --text:#2a241c; --muted:#6b5f4c; --seal:#b3362b; --indigo:#2b4a6f; --gold:#c9a24f;
  --display:"Song Myung","Nanum Myeongjo","Batang",serif;
  --body:"Gowun Batang","Nanum Myeongjo","Batang",serif;
  --ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--text)}
body{font-family:var(--body);-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#cv{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}

/* HUD */
.hud{position:fixed;left:0;right:0;top:0;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;pointer-events:none;z-index:5}
.quest{pointer-events:auto;background:rgba(241,234,216,.94);border:2px solid var(--ink2);box-shadow:0 3px 0 rgba(0,0,0,.35);padding:7px 12px;max-width:min(520px,62vw);font-family:var(--ui);font-size:13px;line-height:1.45}
.quest .ch{font-family:var(--display);font-size:16px;color:var(--seal);display:block}
.quest .obj::before{content:"▸ ";color:var(--indigo)}
.hbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto}
.hb{background:rgba(241,234,216,.94);border:2px solid var(--ink2);box-shadow:0 3px 0 rgba(0,0,0,.35);padding:6px 10px;font-family:var(--ui);font-size:13px;white-space:nowrap}
.hb:hover{background:var(--paper)}
.hb .n{color:var(--seal);font-variant-numeric:tabular-nums;margin-left:3px}
.money{font-family:var(--ui);font-size:13px;background:rgba(241,234,216,.94);border:2px solid var(--ink2);padding:6px 10px;color:#7a5a12;font-variant-numeric:tabular-nums}

/* 대화 */
.dlg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(780px,calc(100% - 24px));background:var(--paper);border:3px solid var(--ink2);box-shadow:0 0 0 2px var(--paper) inset,0 0 0 3px var(--line) inset,0 5px 0 rgba(0,0,0,.4);padding:16px 20px 14px;z-index:20;cursor:pointer}
.dlg .nm{display:flex;align-items:center;gap:10px;margin-bottom:6px;min-height:26px}
.dlg .nm b{font-family:var(--display);font-weight:400;font-size:20px}
.dlg .nm .think{font-family:var(--ui);font-size:12px;color:var(--muted)}
.dlg .orig{margin-left:auto;display:inline-grid;place-items:center;width:30px;height:30px;border:2px solid var(--seal);color:var(--seal);font-family:var(--display);font-size:15px;transform:rotate(-6deg);flex:none}
.dlg .tx{font-size:17.5px;line-height:1.85;min-height:3.7em;white-space:pre-wrap}
.dlg .tx.narr{color:#3d3428}
.dlg .more{position:absolute;right:16px;bottom:8px;font-size:12px;color:var(--muted);font-family:var(--ui);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.chs{display:grid;gap:6px;margin-top:10px}
.chs button{text-align:left;background:var(--paper2);border:2px solid var(--line);padding:8px 12px;font-size:16px;line-height:1.5}
.chs button.sel,.chs button:hover{border-color:var(--indigo);background:#e9e4d3}
.chs button .k{font-family:var(--ui);font-size:12px;color:var(--muted);margin-right:8px}

.dlg.hasp .nm{margin-left:150px}
.dlg .port{position:absolute;left:14px;bottom:calc(100% - 44px);width:136px;height:136px;object-fit:cover;border:3px solid var(--ink2);background:var(--paper2);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.cimg{display:block;width:calc(100% + 52px);max-width:none;margin:-24px -26px 16px;aspect-ratio:16/9;object-fit:cover;border-bottom:3px solid var(--ink2)}
@media (max-width:560px){.dlg .port{width:84px;height:84px;left:10px;bottom:calc(100% - 26px)}.dlg.hasp .nm{margin-left:92px}.cimg{width:calc(100% + 36px);margin:-18px -18px 12px}}
.dlg.story{background:#efe6d0}
.dlg.story .tx{color:#4a3d2c;font-style:normal}
.routes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:10px;text-align:left}
.route{display:grid;grid-template-columns:84px 1fr;gap:4px 12px;align-items:start;background:rgba(241,234,216,.95);border:3px solid var(--ink2);padding:12px;box-shadow:0 5px 0 rgba(0,0,0,.4);color:var(--text)}
.route:hover,.route:focus-visible{border-color:var(--seal);transform:translateY(-2px)}
.route img{grid-row:span 2;width:84px;height:84px;object-fit:cover;border:2px solid var(--ink2)}
.route b{font-family:var(--display);font-weight:400;font-size:22px}
.route span{font-family:var(--ui);font-size:13px;line-height:1.6;color:var(--muted)}
.bt .pc img{width:96px;height:96px;object-fit:cover;border:2px solid var(--ink2);display:block;background:#d9cfb4}
.gl{margin-top:8px;padding:8px 10px;background:#e9e2cf;border-left:3px solid var(--indigo);font-family:var(--ui);font-size:14px;line-height:1.7;color:#3a3226;white-space:normal}
.gl b{font-family:var(--display);font-weight:400;color:var(--indigo);margin-right:8px;font-size:14px}
.dlg .gl{max-height:7.5em;overflow:auto}
.rec.tipr{border-left-color:var(--indigo);font-family:var(--ui);font-size:14px}
.hb.ping{animation:ping .8s ease-out}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(43,74,111,.8)}100%{box-shadow:0 0 0 12px rgba(43,74,111,0)}}
.mg .seq{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.mg .arr{width:40px;height:40px;display:grid;place-items:center;border:2px solid var(--line);background:var(--paper2);font-size:22px;font-family:var(--ui)}
.mg .arr.ok{background:#dfe6ef;border-color:var(--indigo);color:var(--indigo)}
.mg .arr.cur{border-color:var(--seal);background:#fff3d6;transform:scale(1.12)}
.mg .cloth{position:relative;height:56px;background:repeating-linear-gradient(45deg,#f5ecd8 0 8px,#efe3c8 8px 16px);border:2px solid var(--ink2);margin-top:10px}
.mg .seam{position:absolute;left:4%;right:4%;top:50%;border-top:2px dashed #b9a987}
.mg .thread{position:absolute;left:4%;top:calc(50% - 2px);height:4px;background:repeating-linear-gradient(90deg,var(--seal) 0 10px,transparent 10px 16px);max-width:92%;transition:width .15s}
.mg .pad4{display:grid;grid-template-columns:repeat(4,56px);gap:8px;justify-content:center;margin-top:10px}
.mg .pad4 button,.mg .pad2 button{height:52px;font-size:22px;font-family:var(--ui);background:var(--paper2);border:2px solid var(--ink2);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.mg .pad2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mg .pad2 button{font-size:16px}
.mg .gauge{height:14px;border:2px solid var(--ink2);background:var(--paper2);margin-top:10px}
.mg .gauge i{display:block;height:100%;width:0;background:var(--indigo);transition:width .1s}
.mg .wellbox{position:relative;height:150px;margin:10px auto 0;width:140px;background:linear-gradient(#8f8a7e,#6f6a60);border:3px solid var(--ink2);border-radius:6px}
.mg .rope{position:absolute;left:50%;top:0;width:2px;background:#cbb178;height:84%}
.mg .bucket{position:absolute;left:50%;transform:translateX(-50%);bottom:8%;font-size:30px}
.mg .pot{position:relative;width:150px;height:150px;margin:10px auto 0;border-radius:50%;background:radial-gradient(circle,#f4efe4 0 45%,#2b2622 46% 60%,#1d1813 61%);border:3px solid var(--ink2)}
.mg .ladle{position:absolute;left:50%;top:14%;width:6px;height:36%;margin-left:-3px;background:#8e6a44;transform-origin:50% 100%;transition:transform .12s}
.mg .next{position:absolute;left:0;right:0;bottom:-26px;text-align:center;font-family:var(--ui);font-size:13px;color:var(--muted)}
.mg .words{display:flex;flex-wrap:wrap;align-items:center;gap:2px;justify-content:center;margin:14px 0;font-size:22px;font-family:var(--display)}
.mg .gap{min-width:26px;height:40px;border:0;background:transparent;color:#b9a987;font-size:20px;border-radius:6px}
.mg .gap:hover{background:#efe3c8}
.mg .gap.on{color:var(--seal);font-weight:700;background:#f7e2dc}
.mg .dishes{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.mg .dish{font-family:var(--ui);font-size:14px;background:var(--paper2);border:2px solid var(--line);padding:6px 10px}
.mg .dish.sel{border-color:var(--seal);background:#fff3d6}
.mg .table{display:grid;grid-template-columns:1fr 1fr 1fr 70px;grid-template-rows:64px 64px;gap:8px;padding:12px;background:#8e5a34;border:3px solid #5a3b22;border-radius:8px}
.mg .slot{background:#a8744a;border:2px dashed #e8d2a8;color:#fff4de;font-family:var(--ui);font-size:13px;display:grid;place-items:center;line-height:1.2}
.mg .slot b{font-weight:500;display:block}
.mg .slot i{font-style:normal;opacity:.75}
.mg .s-b1{grid-column:1;grid-row:1}.mg .s-b2{grid-column:2;grid-row:1}.mg .s-b3{grid-column:3;grid-row:1}.mg .s-f1{grid-column:1;grid-row:2}.mg .s-f2{grid-column:2/4;grid-row:2}.mg .s-s{grid-column:4;grid-row:1/3}
.mg .mgmsg{min-height:1.6em;margin-top:8px}
.lnk{background:none;border:0;color:#e3c27a;text-decoration:underline;font-family:var(--ui);font-size:12px;margin-top:6px;cursor:pointer}
.tq{display:block;font-style:normal;font-size:12.5px;opacity:.8;margin-bottom:3px;border-left:2px solid currentColor;padding-left:7px}
.mg .cloth2{position:relative;height:96px;margin-top:10px;background:var(--cl);border:2px solid var(--ink2);border-radius:4px;overflow:hidden;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.mg .cloth2 .weave{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.14) 0 2px,transparent 2px 5px),repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px 5px)}
.mg .cloth2 .seam2{position:absolute;left:5%;right:5%;top:58%;border-top:2px dashed rgba(60,40,20,.35)}
.mg .cloth2 .st{position:absolute;top:calc(58% - 3px);height:5px;background:#b23a2a;border-radius:3px;box-shadow:0 1px 0 rgba(0,0,0,.35);animation:stIn .18s ease-out}
.mg .cloth2 .st.out{animation:stOut .25s forwards}
@keyframes stIn{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1)}}
@keyframes stOut{to{opacity:0;transform:translateY(10px) rotate(20deg)}}
.mg .cloth2 .thr{position:absolute;top:calc(58% - 1px);height:3px;background:#b23a2a;opacity:.8;transition:left .15s,width .15s}
.mg .cloth2 .needle{position:absolute;top:calc(58% - 62px);width:9px;height:76px;margin-left:-4px;filter:drop-shadow(0 0 1px #222) drop-shadow(2px 3px 0 rgba(0,0,0,.25));transform:rotate(-28deg);transform-origin:50% 90%;transition:left .15s}
.mg .cloth2 .needle::before{content:"";position:absolute;left:1px;top:0;width:7px;height:100%;background:linear-gradient(90deg,#8d949c,#eef1f4 45%,#7d848c);border-radius:2px 2px 50% 50%/2px 2px 100% 100%}
.mg .cloth2 .needle i{position:absolute;left:3px;top:6px;width:3px;height:10px;background:var(--cl);border-radius:1px}
.mg .cloth2 .needle.dip{animation:dip .24s ease-in-out}
@keyframes dip{0%{transform:rotate(-28deg) translateY(0)}45%{transform:rotate(-8deg) translateY(22px)}100%{transform:rotate(-28deg) translateY(0)}}
.mg .cloth2 .needle.done{animation:lift .6s forwards}
@keyframes lift{to{transform:rotate(-60deg) translate(-10px,-30px);opacity:0}}
.mg .cloth2.tangle{animation:tangle .3s}
@keyframes tangle{25%{transform:translateX(-5px) rotate(-.6deg)}75%{transform:translateX(5px) rotate(.6deg)}}
.mg .cloth2.finish{box-shadow:0 0 0 4px #e3c27a,inset 0 -6px 0 rgba(0,0,0,.08);transition:box-shadow .3s}
.mg .cloth2 .spark{position:absolute;top:calc(58% - 14px);width:28px;height:28px;margin-left:-14px;border-radius:50%;pointer-events:none;opacity:0}
.mg .cloth2 .spark.on{animation:spark .35s ease-out}
@keyframes spark{0%{opacity:.9;box-shadow:0 0 0 0 rgba(255,236,170,.9)}100%{opacity:0;box-shadow:0 0 0 14px rgba(255,236,170,0)}}
.mg .sewbar{display:flex;justify-content:space-between;font-family:var(--ui);font-size:13px;margin-top:6px;min-height:1.4em}
.mg .sewbar .combo{color:var(--seal);font-weight:700}
.mg .sugi{position:relative;background:#f7f0dc;border:2px solid var(--ink2);padding:14px 16px 18px;margin-top:8px;font-family:var(--display);font-size:17px;line-height:1.9}
.mg .sugi .orig{position:absolute;right:8px;top:6px}
.mg .sugi p{margin:0}
.mg .sugsign{display:inline-block;margin-top:8px;color:var(--seal);font-family:var(--ui);font-size:14px;animation:stIn .3s}
.mg .sugsign i{font-style:normal;font-family:var(--display);font-size:22px;border:2px solid var(--seal);padding:0 6px;margin-left:6px}
.mg .picks{display:grid;gap:6px;margin-top:8px}
.mg .picks.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.mg .picks button{font-family:var(--ui);font-size:14px;text-align:left;background:var(--paper2);border:2px solid var(--line);padding:8px 10px;cursor:pointer}
.mg .picks button.on{border-color:var(--indigo);background:#dfe6ef}
.mg .picks button:hover{border-color:var(--indigo)}
.mg .resp{margin-top:10px;font-family:var(--ui);font-size:14px;color:var(--seal)}
.mg .brushwrap{display:flex;justify-content:center;margin-top:10px}
.mg .brush{display:grid;justify-items:center;gap:4px;background:var(--paper2);border:2px solid var(--ink2);padding:8px 18px;cursor:pointer;touch-action:none;user-select:none;font-family:var(--ui);font-size:13px}
.mg .brush svg{width:160px;height:70px}
.mg .brush .stroke{fill:none;stroke:#1d1813;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.mg .route{display:flex;flex-wrap:wrap;gap:4px 0;align-items:center;margin:12px 0}
.mg .route .stop{display:flex;align-items:center;font-family:var(--ui);font-size:13px}
.mg .route .stop i{display:inline-block;width:18px;height:3px;background:var(--line)}
.mg .route .stop:first-child i{display:none}
.mg .route .stop b{font-weight:500;border:2px solid var(--line);background:var(--paper2);padding:3px 7px;min-width:34px;text-align:center}
.mg .route .stop.on i{background:var(--indigo)}
.mg .route .stop.on b{border-color:var(--indigo);background:#dfe6ef;color:var(--indigo)}
.mg .route .stop.cur b{border-color:var(--seal);border-style:dashed}
#mini{position:fixed;right:12px;top:calc(58px + env(safe-area-inset-top,0px));z-index:4;border:2px solid var(--ink2);box-shadow:0 3px 0 rgba(0,0,0,.35);background:#1b1a17;image-rendering:pixelated;display:none;pointer-events:none}
@media (max-width:560px){#mini{top:auto;bottom:calc(120px + env(safe-area-inset-bottom,0px));right:10px;transform:scale(.8);transform-origin:right bottom}}
body.talking #mini{opacity:.35}
.mg .psg{position:relative;background:#f7f0dc;border:2px solid var(--ink2);padding:10px 40px 10px 12px;margin:8px 0;font-family:var(--display);font-size:16.5px;line-height:1.9;max-height:12em;overflow:auto}
.mg .psg .orig,.mg .sugi .orig{position:absolute;right:8px;top:6px;display:inline-grid;place-items:center;width:26px;height:26px;border:2px solid var(--seal);color:var(--seal);font-family:var(--display);font-size:13px;transform:rotate(-6deg)}
.mg .psg .hit{background:#dfe6ef;color:var(--indigo);font-weight:700;border-radius:3px;padding:0 2px}
.histlnk{margin-left:auto;font-family:var(--ui);font-size:12px;background:transparent;border:1.5px solid var(--line);padding:2px 8px;color:var(--muted)}
.histlnk:hover{border-color:var(--indigo);color:var(--indigo)}
.dlg .orig+.histlnk{margin-left:8px}
#hist{z-index:90}
#hist .rec.plain{border-left-color:var(--line);color:#4a3d2c}
#hist .seal-s{width:18px;height:18px;font-size:10px;vertical-align:middle}
.mg .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.mg .cards button{display:grid;gap:2px;text-align:left;background:#6d4b2c;color:#f1ead8;border:2px solid var(--ink2);padding:10px;min-height:70px;font-family:var(--ui);font-size:13px}
.mg .cards button b{font-family:var(--display);font-weight:400;font-size:17px}
.mg .cards button.on{background:#f7f0dc;color:var(--text);border-color:var(--gold);animation:stIn .25s}
.mg .cards button.on span{color:var(--muted)}
.mg .picks button:disabled{opacity:.6;cursor:default}
.ek{font-weight:700;color:#2a1d10;background:linear-gradient(transparent 58%,rgba(242,201,76,.6) 58%);padding:0 1px}
.eb2{font-weight:700;color:var(--seal)}
.alias{font-family:var(--ui);font-size:12.5px;color:var(--muted)}
.mg .arena{position:relative;height:90px;margin-top:10px;background:linear-gradient(#8a9a5a,#6f7f48);border:2px solid var(--ink2);overflow:hidden}
.mg .arena .zone{position:absolute;top:0;bottom:0;width:13%;background:rgba(179,54,43,.28);border-left:2px dashed var(--seal);border-right:2px dashed var(--seal)}
.mg .arena .zl{left:30%}.mg .arena .zr{right:30%}
.mg .arena .ballc{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7cf,#f5cd4f 40%,#b3800f);box-shadow:0 0 16px 4px rgba(255,222,120,.7)}
.mg .arena .ballc.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.35)}}
.mg .arena .tg{position:absolute;top:22px;font-size:40px;line-height:1}
.mg .belly{position:relative;height:110px;margin-top:10px;border-radius:50px;background:radial-gradient(ellipse at center,#6b1f1a,#3a0f0c 70%);border:3px solid #1d1813;overflow:hidden}
.mg .belly .organ{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7cf,#f5cd4f 40%,#b3800f);box-shadow:0 0 18px 6px rgba(255,222,120,.6)}
.mg .belly .gauge2{position:absolute;left:12px;right:12px;bottom:10px;height:10px;background:rgba(0,0,0,.35);border:1px solid #f1ead8}
.mg .belly .gauge2 i{display:block;height:100%;width:0;background:#f2c94c;transition:width .15s}
.mg .belly .bl{position:absolute;left:14px;bottom:22px;color:#f1ead8;font-family:var(--ui);font-size:12px}
.mg .scrolls{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.mg .scrolls figure{margin:0;text-align:center;font-family:var(--ui);font-size:13px;color:var(--muted)}
.mg .scrolls svg{width:100%;max-width:170px}
.sheet.itemget{text-align:center;position:relative;overflow:hidden}
.itemget>*:not(.rays){position:relative}
.itemget .itimg{display:block;margin:6px auto 10px;width:min(240px,58vw);border-radius:8px;border:3px solid #8a6a1f;box-shadow:0 0 40px 8px rgba(255,210,110,.6);animation:itrise .9s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes itrise{from{transform:translateY(50px) scale(.5);opacity:0}}
.itemget .rays{position:absolute;left:50%;top:140px;width:640px;height:640px;margin:-320px 0 0 -320px;background:repeating-conic-gradient(rgba(255,215,120,.22) 0 9deg,transparent 9deg 18deg);border-radius:50%;animation:itspin 14s linear infinite;pointer-events:none}
@keyframes itspin{to{transform:rotate(360deg)}}
.thumb{float:right;width:52px;height:52px;object-fit:cover;border:2px solid var(--line);border-radius:4px;margin-left:6px}
.mg .unroll{overflow:hidden;animation:unroll 1.1s ease-out both;border:2px solid #6d4b2c}
.mg .unroll img{display:block;width:100%}
.mg .scrolls figure:nth-child(2) .unroll{animation-delay:1s}
@keyframes unroll{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.mg .backwrap{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;margin-top:8px}
.mg .back{width:100%;max-width:320px;background:#f7f0dc;border:2px solid var(--ink2)}

<script>
const BODY=new Set(["숙종대왕 즉위 후 십 년 동안 나라가 태평하고 백성이 편안하며 집집마다 유족(有足)하고 자손이 번영하였으므로, 그야말로 요지일월(瑤池日月)이요, 순 임금의 천하 같은 좋은 세상이니, 이런 태평세월에 백성이 배불리 먹고 논밭에서는 즐거운 격양가(激壤歌)를 높이 부르게 되니라.","이때 서울에 유명한 두 명의 재상이 있었으니, 하나는 이 정승이요, 하나는 김 정승이었는데 서로 정의가 매우 깊었으나, 서로 아들이 없어서 같은 사정을 서로 위로하며 지냈으니, 하루는 이 정승의 꿈에 청룡이 오색 구름을 타고 여의주(如意珠)를 희롱하다가 난데없는 백호(白虎)가 달려왔으므로 한강으로 쫓아 버리고 하늘로 올라가니라.","그 달부터 이 정승 부인에게 태기(胎氣)가 있어서 십 삭만에 아들을 낳았으므로 이름을 혈룡이라고 지어 불렀으니, 김 정승도 같은 때에 꿈을 꾸었는데, 백호가 산을 넘어서 한강을 건너려다가 용감한 청룡을 만나서 강물에 빠졌으니, 이 꿈을 부인과 이야기하고 이상히 여겼더니 그 달부터 태기가 있어서 십 삭만에 신기한 아들을 낳았으므로 이름을 진희라고 지어 부르니라.","이 두 집 재상의 아들은 모두 잘 자랐는데, 기골이 장대하고 풍모가 늠름하니라.","김진희와 이혈룡이 한 글방에서 공부하였는데, 모두 총명한 재주로서 옛사람들을 능가하니라.","어려서부터 동창으로 공부한 그들의 정의(情意)는 동골동태(同骨同胎)의 친형제 같았으며, 두 집이 대대로 친구로 사귀어 오는 사이라 후세의 자손들도 자연 세의(世誼)를 저버릴 수는 없었으니, 진희와 혈룡은 소년 시절에 서로 장래를 언약하니라.","우리 두 사람의 정리(情理)를 생각하면 살아 있는 동안은 물론이요 우리 후세의 자손들까지 우리 조상이 하신 듯이 세의를 이어서 저버리지 말자.","세상의 복록(福祿)이란 변화무쌍해서 어찌 될지 모르니, 네가 먼저 귀하게 되면 나를 도와주고, 내가 먼저 귀하게 되면 너를 도와주기로 약속하자.","서로 이처럼 태산(泰山)같이 맺어서 언약하고, 금석(金石)같이 맺어서 맹약(盟約)하고 의좋게 지내는데 뜻밖에도 김 정승과 이 정승이 우연히 얻은 병으로 백약(百藥)의 효험이 없는 천명(天命)이라 회생하기가 어렵게 되었으며, 점점 병세가 위중해지자 상감께서 대경실색하고 만조백관(滿朝百官)을 모아 놓고 가로되,","과인의 수족(手足) 같은 신하 김 정승과 이 정승이 공교롭게도 함께 병으로 백약이 무효(無效)하고 위중하니 어떻게 회생시킬 수 없겠는가?","백관이 상감의 걱정하시는 말을 듣고 황송하게 여기더라.","전하께 황송하고 우의(友誼)로서 애석하오나 천명은 인력(人力)으로 어찌할 수 없사오니 천행(天幸)을 기다려 보는 수 밖에 없사옵니다.","상감은 어의(御醫)를 불러서,","전의가 급히 가서 두 제상의 병을 구해 보라.","하고 명하여 보냈으나 병세가 기울었으므로 비록 편작 같은 명의라도 살릴 수는 없었으니, 두 승상이 마침내 같은 날에 함께 별세하매, 두 집의 유족과 친척들이 앙천통곡(仰天痛哭)하니라.","상감이 이 슬픈 보고를 들으시고 슬퍼하시며, 금은 삼백 냥을 각각 부의로 내려 주셨으므로 양가(兩家)에서 천은에 감격하고 초종지례(草終之禮)를 극진히 지내고, 이어서 삼년상을 지성으로 모시니라.","이때 김 정승의 아들 진희는 가세가 부유하여 잘 살았으나, 이 승상의 아들 혈룡은 가세가 점점 기울어져 그날 살아가기도 곤궁하게 되었고, 김진희는 운수(運數)도 좋아서 소년등과(少年登科)하여 평양 감사가 되어 도임 길을 떠나게 되니, 도임행차가 지나는 곳마다 각 읍의 진공(進供)과 백성들의 도열환영(堵列歡迎)이 역로(驛路)를 메우고 진동하니라.","평양에 당도하자 팔백 명의 나졸이 대로(大路)상에 늘어서고 풍류 소리가 원근(遠近)에 울렸고, 신임 감사는 찬란한 금마(金馬) 위에서 위엄이 당당하였는데, 영축하는 녹의홍상(綠衣紅裳)의 평양 기생들은 각별히 곱게 단장하고, 구름 같은 눈썹을 여덟 팔(八) 자로 다듬고, 옥 같은 연지 볼은 삼사월 호시절(好時節)의 꽃송이 같고, 박 속 같은 잇속은  두 이(二) 자로 방그레 웃어 반만 벌리고서, 흰 모래밭에 금자라 같은 걸음으로 아기작아기작 왕래하니 어느 눈이 황홀하지 않으랴.","평양 감사 김진희는 도임 후에 각 읍 수령들의 연명(延命)을 받고, 삼일 후에 육방(六房) 점고(點考)도 마친 다음, 기생점고를 할 적에, 영주선이, 김선월이, 옥문이, 옥단춘이 등등 앵무 같이 곱게 꾸민 얼굴과 옷 모양과 걸음걸이로 갖은 아양으로 미색(美色)을 다투어 감사의 눈에 들어서, 영광의 수청을 들까 하는 광경이 저희들끼리 시기와 질투의 암투(暗鬪)를 하고 있었으니, 그중에서 옥단춘이라는 기생은 지체가 비록 기생이나 행실이 송죽(松竹) 같고 본심이 정결하여 도임하는 수령들과 감사들이 반하여 수청을 들라는 엄명을 하여도 모두 거절하고 글공부에 힘쓰며 세월을 보내고 있었는데, 기적(妓籍)에 매인 몸이라 점고는 받을망정 행실이야 변하랴고 정조를 굳게 지키니라.","김 감사가 기생을 일일이 점고한 끝에 옥단춘의 모양이 가장 귀엽게 보였으므로, 통인(通引)을 불러서 오늘부터 옥단춘을 수청으로 정하라고 분부하니, 호장(戶長)이 감사의 분부를 듣고 옥단춘의 집으로 달려가서,","춘아 춘아, 옥단춘아, 버들잎에 피어난 춘아, 사또께서 너를 불러 수청들라 명하시니 아니 가지는 못하리라.","네가 만일 이번에도 수청을 거역하면 너 때문에 나 경치니 단장하고 어서 가자.","옥단춘이 깜짝 놀라서 다시 묻기를,","여보 호장, 들어 보소.","내가 비록 기생이나 공부하는 처녀인데 수청이란 웬 말이오.","네 사정은 그러하나 사또 분부 엄중하니 아니 가지는 못하리라.","우리 또한 난처하니 잔말말고 어서 가자.","옥단춘은 하는 수 없이 입고 있던 옷을 채복(彩服)으로 갈아입고 미친 여자 모양으로 들어가자, 갑자기 옥단춘의 손을 잡아서 앉힌 후에 흥겨운 수작을 서슴지 않으니, 옥단춘이 하는 수 없이 수응수답(酬應酬答) 건성으로 감사의 비위만 맞추고 어물쩡하니라.","감사는 옥단춘에게 짝사랑에 빠져 정사(政事)에는 마음이 없이 풍악과 주색을 일삼으니라.","이때 이혈룡은 가세가 곤궁하여 늙은 모친과 처자를 데리고 살 길이 막연하니라.","날품을 팔자 하니 배우지 못한 상일이요, 빌어먹자 하니 가문을 더럽힐까 두려웠고, 굶어서 죽자 해도 늙은 모친과 연약한 처자를 두고 차마 죽지도 못하는 처지라.","죽지도 못하여 근근이 지내니, 자기 배가 아무리 고파도 노모에게 그런 눈치를 보이지 않으려고 참았으며, 팔아먹을 것도 없어진 혈룡은 자기 머리[髮]을 베어서 팔아다가 쌀되와 바꾸어 한 끼를 먹기까지 하였으나 그것도 그때뿐이지, 머리가 또 빨리 자라 줄 리도 없었으니,","이때 그는 친구 김진희가 평양 감사가 되어 갔다는 소문을 듣고 깜짝 놀라 기뻐하며 생각하기를,","내가 이렇게 죽을 지경에 친구가 큰 벼슬을 하였다니 듣던 중 반가운 말이라.","그 친구의 도움을 받을 생각으로, 모친에게 상의하기를,","김 정승의 아들 진희와 그전에 친히 지낼 적에 맺은 언약이 있었는데, 지금 들으니 그가 평양 감사로 갔다 하오니, 옛날 정분과 약속을 생각해도, 제가 찾아가면 괄시는 하지 않고 살려줄 것이니, 가볼까 하오나 재상가 자손으로 구걸 모양으로 갈 수도 없고, 노자 한푼도 없으니 그 일조차 막연합니다.","그러나 의식(衣食)이 없으니 무슨 염치를 차리겠습니까?","좌우간 빨리 다녀오겠으니 고생이 되더라도 용서하고 기다려 주십시오.","평양까지 갈 일을 생각하니 날아갈까 뛰어갈까 마음만 초조하더라.","그 친구를 찾아서 가기만 하면 기갈(飢渴)을 면할 것이오.","돈백이나 얻어 가지고 집으로 돌아올 듯하나 노자 한 푼 없이 먼 길을 걸어 갈 도리가 막연하니라.","우리 집과 똑같은 충신의 자손으로서 그는 저렇듯 귀하게 되었는데 나는 왜 이토록 곤궁이 자심(滋甚)할까?","참으로 슬픈 팔자로다.","혈룡은 통곡하다가 또 혼자 넋두리하기를,","내 복록(福祿)의 운수가 부족하냐?","죄 주는 귀신이 나를 시기하는 천운이 이럴 바에야 누구를 원망하랴.","모친이 탄식하는 아들을 위로하기를,","너는 너무 슬퍼하지 마라.","남아 궁달(窮達)이 때가 있는 법이니, 어찌 하늘이 무심코 너를 시련만 하랴.","혈룡이 모친 앞을 물러나와 아내에게 당부하기를,","당신은 모친을 모시고 내가 다녀올 때까지 기다리시오.","제 생각에도 당신이 평양에 가시면 그 친구 분이 괄시는 아니할 듯하니 우선 가실 방도를 구하시오.","하고, 우례(于禮)를 입었던 의복을 팔아서 받은 약간의 돈을 내주면서 노자로 쓰라고 하며 빨리 떠나기를 권하였으니, 이에 약간의 노자가 마련된 혈룡은 모친과 아내를 하직하고 떠날 적에,","나는 가서 한때나마 연명(延命)하겠지만, 모친과 처자는 내가 다녀올 동안에 어떻게 연명하겠습니까?","통곡하는 소리가 처량하니, 아내가 빨아 두었던 옷을 갈아 입혀 주니라.","마침내 떠날 때에 모친에게,","소자는 자식으로서 부모를 봉양하여 은공을 갚지 못하고 유리걸식(流離乞食)하러 가오니 어디를 간들 이 불효의 몸을 용납하겠습니까?","혈룡이 눈물로 가족을 작별하고 평양으로 내려갈 제, 자기 신세를 생각하니 슬픔을 측량하기 어려우니라.","어쩌면 내 행색이 이러할까?","산을 넘고 물을 건널 때마다 탄식을 금하지 못하는 혈룡은 죽장망혜(竹杖芒鞋)로 오백 리 길을 걸어서 평양에 이르니, 평양은 절승의 강산을 이루고 있었으나, 유랑의 흥을 맛볼 겨를도 없이, 감영으로 가서 영문 밖에서 관속(官屬)에게 성명을 통지(通知)하라고 일렀으나, 감사께 남루한 행색으로 함부로 만나게 할 수가 없다고 냉정하게 거절하였다.","이혈룡이 다시 청하며 자기와 감사의 관계를 말하기를,","나는 사또와 죽마고우(竹馬故友)로서 형제같이 지낸 사람이라.","네가 통기만 하면 사또가 반가워할 것이니 염려말고 곧 통기(通寄)하라.","문지기에게 재삼 사정하니라.","이 일을 어찌할까?","애고 지고 어찌할까?","모친과 아내 날 보내고, 배고파서 기진하며, 오늘이나 올라올까, 내일이나 올라올까, 돈 얻어서 돌아올까 주야장천(晝夜長川) 바랄 텐데, 어찌 하란 말인가?","이런 탄식으로 영문에서 길이 막혀, 십여 일이나 집에 묵으면서, 평양 감사 김진희를 만나려고 애쓰니라.","그러는 동안에 노자는 다 떨어지고, 그대로 돌아가면 모친과 처자를 무슨 면목으로 대할 것인가.","그러나 높은 벼슬로 엄중한 영문 안에 있는 친구도 만나지 못한 딱한 신세는, 빈손으로 돌아가려 하여도 노자 한 푼 없어 갈 수 없고 평양에 있을 수도 없고 서울로 올라갈 수도 없게 되었고, 더구나 밥값 치르지 못하는 행각을 주막 주인도 싫어하였으므로 통곡하매 그 정상을 듣는 사람이 모두 가엾게 여기니라.","모든 것이 절망이라 눈앞이 캄캄해진 이혈룡은 대동강 깊은 물에 몸을 던져서 죽을 결심도 하였으나, 다시 생각하면,","불쌍한 모친과 처자가 나만 기다리고 있는데, 내가 죽은 기별도 하지 못하면 참아 죽을 수도 없지 않으냐.","모친과 처자는 내 신세가 지금 이렇게 된 줄도 모르고 돈푼이나 얻어 가지고 오늘이나 올까, 내일이나 올까, 주야장천 고대할 것이 아니냐.","그러니 객지(客地)에서 죽을 수도 없고 푼전의 노자도 없는 과객(過客)을 괄시하는 주막집 주인은 나가라고 구박하니, 이 넓은 천지간에 이런 팔자가 어디 있으랴.","이런 탄식을 하면서도 굶으면 죽을 목숨이나 입은 옷을 하나씩 벗어 팔아서 기갈(飢渴)을 면하였으나, 그것도 일시뿐이었으니, 하루 종일 영문에 가서 문지기에게 사또 면회를 청하였으나, 처음에는 거지 대접으로 사또에게 통지하지 않던 문지기들도 이제는 미친 사람이라고 아예 대꾸도 하지 않으니라.","그의 애걸하는 꼴은 실성한 사람 같기도 하려니와, 속옷만 입은 옷이 때묻고 떨어져서 거지 중에서도 상거지 모양이라.","그래도 죽지 못한 목숨이라 평양 거리를 헤매며 문전걸식(門前乞食)을 하던 차에, 하루는 김 감사가 각 읍 수령을 불러서 대동강변 연광정에서 큰 잔치를 한다는 소문을 듣느니라.","그날이 되자 대동강변 연광정에 큰 잔치를 베풀고 풍악 소리가 낭자하며, 팔십 명의 기생들이 제각기 노래와 춤을 자랑하며, 모인 세도가(勢道家)들의 흥을 돋구어 주고 있었는데, 김감사는 취흥을 못 이기어 시조 가락으로 농(弄)을 하기를,","백구야 펄펄 날지 마라, 너 잡을 내 아니다.","어허하 수령들 내 말을 들어 보라, 삼사월 호시절에, 온갖 잡화(雜花) 다 피었는데, 세류청천 저 버들과 좌우편의 저 두견아, 슬피 우는 네 소리 들어 보니, 철석간장(鐵石肝腸) 안 녹으랴.","하고 도도한 취흥으로 멋있게 놀고 있었으니, 이때 연광정 밑에 기진맥진한 빈 배를 움켜잡고 그 풍성한 산해진미(山海珍味)의 음식을 바라보니 뱃속의 회가 동(動)하였으나, 화중지병(畵中之餠)을 어찌 얻어먹을 수가 있으랴.","원망스러운 눈은 대동강으로 돌려서 보니, 십리 청각에 오리들은 물결을 따라 둥실둥실 떠서 쌍쌍이 놀고, 백리 평사(平砂)에 백구들은 쌍을 지어 한가롭게 놀고 있었으니, 이혈룡은 마침내 결심하고 틈을 타서 연회장으로 접근해 가서 갑자기 큰 소리로 외치기를,","평양 감사 김진희야, 너는 여기 와 있는 이혈룡을 몰라보느냐!","두 세 번 외친 뒤에야 취한 김 감사가 알아듣고,","호장, 저놈이 어떤 놈이냐!","호장이 찔끔하고 뛰어와서 이혈룡의 뺨을 치고 등을 밀며, 상투를 잡아끌고 가서 감사 앞에 꿇어 앉혔는데, 그러자 김 감사가 노성 대발하고,","너 이놈 들으라!","웬 미친놈이 와서 감히 나를 희롱하느냐!","이혈룡이 어이없어 가로되,","나는 서울 이 정승 아들 이혈룡이다.","너를 친구라고 먼 길을 찾아왔으나 감사의 문턱이 하도 높아서 성명조차 통기하지 못하고 달포나 묵느라고 노자도 떨어지고 기갈을 면하지 못하여 문전걸식하고 다니다가, 오늘이야 이 자리에서 너를 보게 되니 이제 죽어도 한이 없다.","그러나 너를 친구라고 찾아왔는데 어찌 이토록 괄시하느냐?","옛날의 친구도 쓸데없고, 결의형제(結義兄弟)도 쓸데없구나.","내가 네 처지라면 친구 대접을 이렇게는 하지 않을뿐더러 내 모든 모욕을 참고 한 가지 청을 하겠으니, 네 술잔 값도 안 될 전백(錢百)이라도 주면 기갈 중에 신음하는 노모와 처자를 잠시 먹여 살리겠다.","하고 대성통곡(大聲痛哭)하였으나, 김 감사는 불쾌한 안색으로 묵묵히 말이 없으매, 이혈룡은 다시 울음 섞인 음성으로 호소하기를,","이 몹쓸 김진희 놈아, 내가 지금 푼전의 노자가 없으니 멀고 먼 서울 길을 어찌 돌아가랴.","그러자 김 감사가 노발대발하고 호통치기를,","너희들 이 미친놈을 배에 실어다가 강물 한 복판에 던져서 물고기 밥을 만들어라.","네잇!","사공들이 영을 받고 이혈룡을 잡아 묶어서 배에 실을 적에 연회장에 있던 기생 옥단춘이 본즉, 김 감사에게,","소녀 금시(今時)로 오한이 나고 몸이 괴로워 견딜 수 없습니다.","하고 거짓 엄살하기를,","그러면 물러가서 약을 써서 빨리 치료하라.","네 황송하옵니다.","하고, 물러나와 이혈룡을 잡아가는 사공들에게,","사공들, 잠깐만 기다려요.","하고 부르니, 사공들이 머무르며, 왜 그러냐고 묻기에,","내 이 양반의 몸값을 후히 줄 테니 죽인 듯이 모래를 덮어서 숨겨 두고 오시오.","하고, 은근한 말로 간청하니라.","이런 유혹을 받은 사공들은 귀가 솔깃해서 서로 얼굴을 바라보면서 수군거리되,","여보게, 자네 생각은 어떤가?","내 생각에는 아무리 사또님 영이지만 죄도 없는 사람을 우리 손으로 어찌 죽이겠는가?","나도 그래.","아침 절개로 유명한 옥단춘 기생 아가씨의 부탁인 데다가 활인적덕(活人積德)하고, 큰돈까지 생기는데 죽일 거야 있겠나?","하고, 옥단춘에게 눈짓을 약속하고 이혈룡을 묶은 채 배에 싣고 대동강에 둥기둥실 젓고 깊은 곳을 향하여 가니, 혈룡은 옥단춘이 뱃사공들을 매수한 기색을 모르고 있었으므로 속절없이 대동강 물귀신이 되어 죽는 줄만 알고 하늘을 우러러 방성통곡(放聲痛哭)하기를,","천지 신명이여 굽어살피소서.","불쌍한 이혈룡의 목숨을 살려 주십소서.","서울에 남은 노모와 처자가 나를 평양에 보낸 후에 이렇게 죽을 줄은 꿈에도 모르고, 오늘 올까 내일 올까 주야장천 바라는데, 내 팔자가 무슨 죄로 갈수록 이같이 기박(奇薄)합니까?","하고 통곡하므로 듣는 사공들도 슬퍼하고, 산천초목까지 슬퍼하는 듯하였는데, 사공들의 거동은 백리 청강(淸江) 맑고 깊은 물에 두둥실 높이 떠서, 어기여차 뱃노래하며 파도 따라 떠내려 갈 제 좌우 강변의 경치를 바라보니, 장성 일면에 용용수(長城一面溶溶水)요, 대야동두에 점점산(大野東頭點點山)이라, 글처럼 이 땅의 승경(勝景)이므로 무이산 열두 봉은 구름 밖에 솟아 있고, 연광정 내린 물은 대동강을 따라 있고, 산천초목 좋은 경치 홍홍백백 고운 곳에, 범파창랑(汎波滄浪) 어부들은 청강홍미(淸江紅眉) 좋은 경치, 백구는 하늘과 물 사이에 너울너울 높이 떠서 쌍쌍 지어 노는 모양, 사람 흥미 자아내고, 동정호 추야월(洞庭湖秋夜月)에 어수청풍(魚水淸風) 노니는데 내 팔자는 무슨 죄로 성은(聖恩)을 다 갚고, 어복중(魚腹中)의 혼(魂)이 되려는가 하고, 이혈룡은 억울하게 죽는 몸을 탄식하기를,","내 한 몸 죽기는 섧지 않으나, 북당(北堂)의 팔십 모친이 나를 보내시고 주야장천 바라다가 이런 줄 모르시고, 자식 낳아 쓸데없다 하실 것이요, 가련한 나의 처자는 늙은 모친 모시고자 오늘 올까 내일 올까 밤낮으로 문밖에서 나와서 기다릴제 소식이 묘연하여 나 죽은 줄 모르고서 모친 처가 잊었는가 야속한 우리 낭군 왜 그리 무정한고 눈물로 보낼지니, 애고 답답한 이 신세야, 어찌하면 모친 처자 만나 볼까?","아아, 나 죽은 혼백이라도 천리 고향 어찌 갈까?","이혈룡이 슬피 통곡하는 말이 수중고혼(水中孤魂)의 귀신이 되어 물과 하늘 사이에 다닐 것을 생각하여 또다시 하늘을 향하여 슬피 호소하기를,","저의 슬픈 마음을 명천(明天)이 밝게 살펴서 이 신세를 도와주십소서.","여기서 한번 목숨만 살려 주시면 무슨 고생을 하더라도 생전에 모친과 처자를 만나 보겠습니다.","하늘에 울고 가는 저 기러기가 한양성 서울을 지날 적에, 여기서 나를 보았다고 부디부디 전해 다오.","이 불효자 혈룡은 대동강의 수중고혼 되어 팔십 노모 버린 죄로 이승 저승 갈 수 없고 어지중천 떠다니며 애고 통곡 울음 울 제 모친 처자 머리 위에 나를 어이 보오리까.","남쪽 가는 기러기야 내가 여기 죽는 소식 부디부디 전해 다오.","아아, 무심한 저 기러기 창망한 구름 밖에 두 날개 훨훨 치며 대답 없이 울고 가니, 내 마음 둘 데 없다.","애고애고 내 신세야 어찌하면 살겠느냐, 모친 처자 우리 고향집에 두고 무슨 일로 평양 왔다가 이 모양이 되었는가?","고금사(古今事)를 생각하니 한심하고 가련하다.","이렇게 울며 호소하는 이혈룡을 실은 배가 대동강을 내려갈제, 좌우 산천에는 황금 같은 꾀꼬리가 버들 속을 왕래하고, 뻐꾹새는 신세 한탄 울음 울고, 저편을 바라보니, 한 많은 두견새가 이리 가며 울고 저리 가며 울어서 혈룡의 심사를 더욱 산란하게 하는데, 때는 마침 춘삼월이라.","이같이 슬픈 원정(怨情) 글로 지어 옥황상제께 올리려도 구만리 장천이라 바칠 길이 전혀 없다.","구중궁궐 우리 성군(聖君), 이런 일을 알으시면 선악 구별 못 하실까?","목을 놓고 우는 소리에 일월이 무광(無光)하고 산천초목과 비금주수(飛禽走獸)도 슬퍼하고, 대동강 맑은 물도 흐르지 않고 울렁울렁 머물었으니, 사공들이 이혈룡을 비로소 위로하여 하는 말이,","여보, 그만 진정하고 안심하소.","사또님 영이 비록 엄격하나, 우리인들 어찌 무죄(無罪)한 인생을 죽이겠소.","당신은 백사장에 누어 몸 위에 모래를 살짝 덮고 숨어 있다가 해가 지고 어둡거든 멀리멀리 도망하시오.","만일 사또가 당신 살린 비밀을 알면 우리가 잡혀 죽을 테니 조심하여 도망하시오.","사공들은 신신당부하고 혈룡을 물가에 내려놓으니, 이생원이 결박을 풀어 준 손으로 사공들의 손을 잡고,","죽게 된 이 인생을 이처럼 살려 주니, 성명을 가르쳐 주시오.","하고 백배사은하며, 후일에 은혜를 갚으려고 성명을 물으니, 사공들이 이생원의 손을 잡고,","남아하처 불상봉(男兒何處不相逢)이니 후일 다시 만납시다.","하고, 성명도 알리지 않고 배를 돌려서 돌아가니라.","혈룡은 사공들의 말대로 모래를 몸에 덮고 누워서 해가 지기를 기다렸으나, 이번에는 배가 고파서 거의 죽게 되니라.","이때 뜻밖에 어떤 사람이 와서 모래를 파헤치면서, 일어나라고 두 세 번 부르니 혈룡이 깜짝 놀랐으나, 숨을 죽이고 죽은 듯이 그냥 누워 있었으니, 그 사람이 은근히 가로되,","여보시오.","겁내지 말고 일어나서 정신을 차리고 나를 보사이다.","나는 당신을 죽이려고 찾아온 사람은 아니오니, 염려말고 어서 일어나서 나를 자세히 보고 요기를 하소서.","이혈룡이 그제야 좀 안심하고 기운을 차려서 눈을 뜨고 바라보니, 어떤 아름다운 여인이 미음 한 그릇을 손에 들고 지성으로 권하지 않는가.","혈룡이 꿈 같은 혼미 중에 생각하되,","부모 은혜를 하늘이 살피심인가?","내 동갑의 어떤 사람이 원통하게 죽은 귀신인가?","아무리 생각하여도 꿈인지 생시인지 전혀 알 수 없었으나, 기갈이 심하던 차라 먹을 것을 보자마자 살 것 같이 반가와 미음 그릇을 반갑게 받아서 단숨에 마시자 정신이 번쩍 나니라.","당신은 어떤 분인데 죽어 가는 인생을 살려 주십니까?","이 은혜는 백골난망(白骨難忘)이니, 거주 성명을 알려 주십시오.","옥단춘이 웃으면서,","저는 다른 사람이 아니라, 평양에 사는 기생이옵더니, 오늘 당신의 무죄한 죽음을 보고 딱하게 생각하고 사공들에게 부탁하였으니, 안심하고 우리 집으로 가서 몸조리를 하십시오.","그런데 이생원은 이 여인을 따라서 평양성 안으로 들어갔다가는 김 감사에게 발각되어 잡혀 죽을까 겁이 나서 굳이 사양하니라.","죽었던 사람을 살려 주신 은혜는 결초보은(結草報恩)하겠으나, 내 신세가 이 땅에는 일시 일각도 머물러 있을 수 없으니 이 길로 멀리 도망쳐 가게 놓아주시오.","제가 비록 기생의 몸이나 당신을 살린 사람이니 아무 염려말고 가십시다.","하고, 옥단춘은 은근히 권하니라.","이생원은 한편 죽었던 몸이매, 살려준 은인의 호의를 어찌 의심하고 거절하랴 하고, 권하는 대로 옥단춘을 따라가니, 이생원은 미인인 기생에게 구원되어 그의 집으로 가는 자기가 마치 새 세상을 만난 듯하니라.","사지(死地)에 빠진 뒤에, 내 몸이 꿈같이 살아났으니 이것이 무슨 천행일까?","신기한 생각을 되풀이하면서 옥단춘의 집에 이르니라.","아담한 집은 단장이 정결하고 주위의 경치도 매우 좋더라.","좌우를 살펴보니 온갖 화초가 만발한 뜰에는 화중부귀(花中富貴) 해당화며, 그 밖에 기화요초(琪花瑤草)가 달빛을 띠고 찬란히 빛나고 향기를 풍기니, 백두두미는 주적주적 걸으면서 긴 목을 늘이고 기룩기룩 반기는 듯하니라.","방안으로 들어가니 분벽사창(粉壁紗窓)이 찬란하니라.","좌우를 둘러보니, 천하 명화의 좋은 그림이 여기저기 걸렸는데, 위수(渭水)의 강태공이 문왕을 기다리며 곧은 낚시를 물에 던지고 어엿이 앉아 있는 모양이 완연하더라.","또 다른 그림에는 시중천자(時中天子) 이태백이 채석강 밝은 포도주를 취하게 먹고 물 속에 비친 달을 잡으려고 넌지시 손을 넣는 광경이 역력하며, 또 저편 벽에는 한나라 종실의 유황숙이 와룡 선생 제갈량을 맞으려고 남양(南洋)땅의 초당으로 풍설 속에 적토마(赤免馬)를 빗겨 타고 지향 없이 가는 정경이 선명하며, 또 한편에는 산중서차인 두 노인이 한가롭게 앉은 모양이 신전의 경지를 보이며, 또 다른 그림에는 상상사호(常常四豪) 네 노인이 바둑판을 앞에 놓고 흑백을 희롱하며, 그리고 대동강의 좋은 풍경을 그린 그림도 여기 저기 걸려 있더라.","옥단춘은 주안상을 들여놓고, 향기 높은 계자조를 유리잔에 가득 부어 들고 권주가를 한 가락 부르면서 이혈룡에게 권하는데,","일배 일배 부인배의 보통 술이 아니오라, 한무제 승로반(承露盤)에 옥로(玉露) 받은 술이오니, 이 술 한잔 잡수시면 천만년을 사시리라.","전에 한번 몸 뵈었으나 내일 보면 구면이니 사양 말고 잡수시오.","이생원 한 두 잔 먹는 사이에 어느덧 취하여 취중에 가로되,","하아, 지난 일을 생각하니 세상사가 허무(虛無)로다.","천만 무궁한 이 자리의 흥취(興趣)를 어찌 다 말하리요.","하고, 밤 가는 줄도 모르며 옥단춘의 환대를 받았으니, 그 뒤로 이생원은 옥단춘의 집에서 신세를 지게 되니라.","이럭저럭 세월이 흘러서 왕실에 세자(世子)가 탄생하자, 나라의 경사를 축하하여 태평과(太平科)의 과거를 보인다는 소문을 들은 옥단춘이 기뻐하고 이혈룡에게 권하여 말하기를,","과거 보인다는 소식이 들리니, 낭군은 과거를 보러 상격하십시오.","충신의 후손으로서 이런 기회를 어찌 허송하겠습니까?","그대 말이 당연하나 늙으신 모친이 내가 오늘 올까 내일 올까 하고 기다리시면서, 초조하게 간장을 녹이고 계신 것을 생각하면, 오늘까지 이렇게 편히 지낸 일이 불효임을 어찌 모르리오.","그러나 이 꼴로 서울 가서 무슨 면목으로 노모와 처자를 대하리오.","하고, 탄식하는 그의 두 눈에서 눈물이 주르르 흐르니, 옥단춘이 거듭 위로하면서,","과거를 힘써 봐서 입신양명(立身揚名)하온 후에 영화를 볼 것이니 너무 상심 마시고 속히 상경(上京)하십시오.","하고, 행장을 수습하여 주면서 신신당부하니라.","이 길로 상경하시되, 새문밖 경기 감영 앞의 이섬부 댁을 찾아가십시오.","그 댁에 제가 부탁할 말씀도 있고, 제 하인도 그 댁에 있으니, 그 하인을 데리시고 과장(科場)에 나아가십시오.","이제 이별하오나, 후일 다시 만날 것이니, 조금도 섭섭히 생각하지 마시고 잘 가셔서 장원급제로 입신양명하신 후에 북당(北堂) 기후(氣候) 안녕하거든 다시 돌아와 주십시오.","하고 손을 잡고 이별하는 옥단춘은 그동안 사귄 정을 안타까워하니라.","이혈룡은 옥단춘의 애정과 격려를 힘으로 서울로 돌아와서, 우선 새문 밖의 이섬부 집을 찾아 가니라.","옥단춘의 편지를 전하고 하인의 인도로 대문에 들어서니, 고대광실(高臺廣室)은 아닐망정 집이 정결하고, 소실대문의 별배(別陪)들이 굽실굽실 문안하고 내정(內庭)으로 모셔 드리니라.","이 댁이 뉘댁이냐?","이혈룡이 의아하여 물으니라.","서방님, 이 댁이 바로 서방님 댁입니다.","이혈룡이 깜짝 놀라며 안으로 들어가니, 뜻밖에도 자기의 모친이 반갑게 맞아 주지 않는가.","곧 모친 앞에 엎드려서 통곡하면서 우선 사죄하니라.","불효자 혈룡이 이제야 돌아왔사옵니다.","어머님은 그동안 안녕하셨습니까?","불효의 이 자식을 생각하며 얼마나 기다리셨습니까?","모친도 아들의 뜻밖의 태도에 놀란 듯이 혈룡의 손을 잡고 슬피 울며 가로되,","혈룡아, 너는 충신의 아들이라 효성이 이렇게 지극하구나.","네가 평양에 간 후에 근근이 지내던 중, 너의 친구 평양 감사가 보내 주신 재물로 가세가 이만큼 요부(饒富)해져서 노비와 전답을 많이 샀으니, 만년(晩年)의 재미를 보며 편하다.","오직 네가 빨리 오기만 기다렸더니 이제 왔으니 참으로 새 세상 만난 것 같이 기쁘다.","인제는 죽어도 하릴없다.","그래 너는 객지에서 얼마나 고생하였느냐?","하고 기뻐하니라.","혈룡은 그제야 옥단춘의 호의로 모든 것이 마련된 것을 깨닫고 속으로 감격하며 아내를 돌아보고,","당신은 모친 모시고 얼마나 고생하였소?","저는 서방님 덕택으로 잔명(殘命)을 보존하였으니, 고맙소이다.","그런데 이처럼 후한 우정으로 우리를 살려 주신 평양 감사님 은혜를 어찌 갚을지 모르겠습니다.","혈룡은 마지못해 평양 간 후의 모든 일을 사실대로 알리자 모친과 아내가, 혈룡이 죽을 고생을 생각하면서 하마터면 생전에 다시 만나 보지 못할 경우를 새삼스럽게 슬퍼하니라.","그와 동시에 옥단춘의 은혜를 치하하여 마지않더라.","오랜만에 만난 가족들은 다시 원만한 가정을 이루게 되니, 이윽고 과것날이 되었으므로 이혈룡은 대궐 안 과거장으로 가서 본즉, 팔도에서 글 잘하는 선비들이 구름같이 모여들어 입신양명의 영예를 다투려고 투지가 장내에 넘치니라.","이윽고 걸린 글제 보니 '천하태평춘(天下泰平春)'이라 하였으매, 글을 지을 생각을 가다듬으면서 먹을 간 혈룡은, 붓을 들어서 조맹부의 필체로 단숨에 내려 써서 맨 먼저 올리니, 시관(試官)들을 거느리고 친히 보시던 상감은 글자마다 비점(批點)이오 글귀마다 관주(貫珠)로 꼬누어진 글을 보고 칭찬하시는 말씀이,","참으로 신기하다.","이 글씨와 글 지은 사람은 반드시 범상치 않으리라.","하시고, 알성급제(謁聖及第) 도장원(都壯元)으로 한림학사(翰林學士)를 제수하시고, 곧 어전입시(御前入侍)하라는 분부를 내리시고, 이한림이 입시하여 천은을 사례하자 상감이 칭찬하고 손수 술잔을 내리시니, 이한림이 어전에 엎드리고,","소신과 같이 무재무능(無才無能)한 자를 이처럼 중신(重信)하려고 칭찬하시오니 황공무지하오며, 또한 한림을 제수하시니 더욱 황공하옵니다.","하고, 물러나와 집에 큰 잔치를 베풀고 향당과 친지를 청하여 경사를 축하하니라.","그리고 한편으로 생각하니,","평양 감사 김진희의 불의 무도한 소행을 나만 당하였으랴.","무죄한 백성들을 무슨 죄목에 걸어서는 행악(行惡)을 하고 수탈에 여념이 없을 것이라.","그 한 명의 흉측한 어복(魚腹)에 평안일도(平安一道)가 희생되는 것을 알면서 어찌 모른 척할 수 있으랴.","나라와 백성을 위하여 마땅히 성상께 여쭙지 않을 수 없다.","하고, 전후 사실을 일일이 밀록(密錄)해 전하께 바치니, 전하가 받아 보시고 탄식한 뒤에 봉서(封書) 삼장을 내리시니,","첫 봉서는 새문 밖에 가서 떼어 보고, 둘째 봉서는 평양에 가서 떼어 보고, 셋째 봉서는 그 후에 떼어 보라.","그리고 도중에 조심하여 다녀오라.","하는 비밀 지령을 주시리라.","이한림이 곧 모친과 부인에게 하직하고 새문 밖에 나가서 첫째 봉서를 떼어 보니, '평안도 암행어사 이혈룡' 이라는 사령장이 들어 있더라.","거기서 비로소 수의를 입고 마패(馬牌)를 찬 후에, 평안도로 급히 출동해 가니라.","며칠만에 평양에 당도하니, 산도 전에 산이요, 물도 전에 보던 물이라.","연광정도 대동강도 잘 있었느냐.","무이산 십이봉은 구름 밖에 솟아 있고, 모든 산천에는 백화가 만발하고 세류청강의 버들가지에 황금 같은 꾀꼬리는 춘홍에 춤을 추며 화류중의 왕래하고 있었느니라.","나는 그동안 서울 가서 모친과 처자를 만나 보고 다시 내려왔다.","대동강 위의 일엽편주(一葉片舟) 나를 싣고 만경창파 두둥실 떠서 가는 배야, 나 온 줄 모르고서 어디 가서 매었느냐.","산수도 새롭게 빛나는구나.","청천의 저 구름은 나오는 양을 보고 몽실몽실 피어 있고, 범파창랑 백구들은 한가롭게 무심하여 나를 어이 모르느냐.","강물은 은은하여 산을 둘러 출림비조(出林飛鳥) 저 물새는 농춘화답(弄春和答) 쌍을 지어 쌍쌍이 날아들고, 녹의홍상 기생들은 오락가락 번화하고, 갑제천문(甲第千門) 좌우에 즐비하니 천문만호(千門萬戶) 가 아닌가.","암행어사 이혈룡은 역졸을 단속하여 각처로 보낸 후에, 둘째 봉서를 뜯어보니,","'암행어사는 평양 감영에 출두하여 봉고파직(封庫罷職)하라' 는 지령이 들어가니, 어사는 다시 역졸을 단속하여 비밀리에 억울한 민정을 샅샅이 적발 보고하라고 명하니라.","그리고 변장을 한 이 어사는 옥단춘의 집으로 찾아가서 대문 밖을 살펴보니 점점 칠야 어둔 밤에 집 안팎이 적막하니라.","옥단춘은 이혈룡을 서울로 보낸 후에 김 감사에게는 칭병(稱病)하고, 연광정 잔치에서 물러난 후에, 새로 정든 낭군이 그리워서 노래를 지어 부르면서 문 밖에 나와서 소식을 기다리니라.","그러나 이혈룡의 소식은 돈절(頓絶)하였으므로 독수공방(獨守空房)에서 수심(愁心)으로 밤낮을 보내니, 이때 춘삼월 호시절이라, 홀로 거문고를 안고서 임 생각의 회포를 풀어 보려고 섬섬옥수(纖纖玉手)로 희롱하며, 새로 지은 노래를 시름없이 부르니라.","임아 임아 낭군님아, 전세의 연분으로 청실홍실 맺은 사이는 아니지만, 눈정으로 맺은 정이 남과는 유달라서, 밥상을 당겨 놓고 임의 생각 문득 나면, 밥도 물도 목이 메오.","그러나 낭군님은 이처럼 타는 내 간장을 모르는가?","홍문연 높은 잔치에 가서 천하 경률(經律) 논하는가?","계명산 추야월(秋夜月)에 장량(長良)의 옥퉁소 소리로 판철제자 헤어졌나?","항우의 어린 고집 범증의 말 안 듣고 판철제자 다 간 후에 우미인과 이별을 구경하는가?","아아 천리마(千里馬) 타고 오실 임의 행차 어이 이리 느리신고.","임아 임아, 서방님아, 과거에 낙방되어 무안하여 못 오시나?","과거는 하였지만 조정의 내직으로 못 오시는가.","일신이 귀히 되어 나를 아주 잊으셨나?","그분이 사람으로 설마 나를 잊었을까?","편지 한 장 없는 것은 인편이 없음인가?","과거를 보았으면 급제도 하였을 텐데, 운이 나빠 낙방(落榜)되었나?","아아, 어찌 이리 소식 없고 오시는 길 묘연한가?","무정하신 낭군님아, 침침칠야(沈沈漆夜) 야삼경에 홀로 누워 기다리니, 눈물만 오락가락 한숨으로 벗을 삼고, 생각만은 임뿐이라.","한탄을 노래 삼아 거문고를 타고 있을 때, 험상궂게 변장한 암행어사 혈룡이 중문 안에 들어가서 어험 하는 기침 소리에 백두루미가 놀라서 끼룩끼룩 울어대니, 옥단춘이 밤중의 인기척에 깜짝 놀라서 거문고를 내려놓고 문을 열고,","거 누구시오?","이 밤중에 누가 와서 날 찾으시오?","기산영수 맑은 물의 소부와 허유가 날 찾으시오?","채석강 이태백이 달 보자고 날 찾나요?","산중처사 도연명이 술 먹자고 날 찾나요?","상산사호(商山四皓)에 노인이 바둑 두자 날 찾는가?","남양 초당의 와룡 선생이 병서(兵書)를 의논하자고 날 찾는가?","밀양읍의 운심이가 놀이 가자 날 찾는가?","당나라의 양귀비가 꽃밭에 물 주자고 날 찾는가?","삼사월 호시절에 천하 문장 김생원이 풍월(風月) 짓자 날 찾는가?","봉래산 박 처사가 옥저 불자 날 찾는가?","누가 와서 날 찾는가?","서울 가신 서방님이 편지 보내 날 찾는가?","갖은 푸념을 하면서 이리 저리 살펴보니, 어떤 거무스레한 사람 혈룡이 뜰에 웅크리고 앉아 있지 않은가.","옥단춘이 찔끔하고 겁이 나서,","웬 사람이 어둔 밤중에 주인 몰래 남의 집에 들어 와서 엿보니냐?","동방예의지국(東方禮義之國)인 우리나라에서, 아무리 무식해도 남녀가 유별한데 밤중에 남의 내정(內庭)에 들어왔으니 이런 불측한 행실이 어디 있니냐, 네가 분명 도적이 아니냐?","하고, 옥단춘은 노복(奴僕)을 부르면서 도적을 잡으라고 호통을 치니라.","그래도 그 사람은 꼼짝하지 않고 앉아 있으니, 옥단춘이 또 의아하되, 도적놈 같으면 그만큼 튀겼으면 응당 달아날 텐데 그러지도 않고, 묵묵히 앉아만 있으니 괴이하지 않을 수 없어, 등불을 켜서 들고 나가서 보니 어떤 사람이 고개를 푹 숙이고 말이 없으니, 옥단춘은 무색도 하고 화도 나서 그 사나이를 왈칵 떼다 미니라.","그제야 고개를 들고 사나이가 하는 말이,","한양 낭군 내가 왔소.","한양 낭군이 이 모양 되어 와도 괄시 않겠는가?","좌우간 방으로 들어가세.","깜짝 놀란 옥단춘은 이혈룡의 거지 주제를 보고 기가 막히는 모양이니라.","이생원님, 이것이 웬일이오?","과거는 못 할망정 모양조차 왜 이 꼴이 되었소?","내 집이 누구 집이라고 그렇게 속이고 놀라게 해요.","나는 서방님 가신 후로 일각이 여삼추(如三秋)로 독수공방에 제발 물어 던진 듯이 홀로 앉아 수심으로 세월을 보내면서, 오늘 오실까 내일 오실까 주야장천 바랐는데, 한번 가신 후로 소식이 돈절하였으니 어찌 그리 무심하오이까?","원망하면서도 종 계집애 매월에게 빨리 목간물을 데우라고 재촉하니라.","혈룡에게 목욕을 시킨 뒤에 섬섬옥수로 빗을 잡고 만수산발 헝큰 머리를 어리설설 빗겨서 황라 상투를 짜 주고 산호 동곳, 호박 풍잠, 석류 동곳, 옥 동곳을 멋있게 꽂아 주니라.","그리고 자재 함롱 반다지를 열고 유렴할 새, 의관을 찾아내어 삼백돌 통영 갓이며 오올뜨기 망건이며, 쥐꼬리 당줄에, 공단싸게 호박 관자(貫子)를 곱게 달아 씌우고, 봄철 새 옷으로 선명히 갈아 입히고, 서방님 얼굴을 다시 보니 그 옥골 선관이 어찌 반갑지 않으랴.","임아 임아 낭군님아, 이처럼 좋은 얼굴, 어찌 그 지경이 되어 왔소?","이혈룡은 사랑스러운 옥단춘에게 우선 감사하고, 다음에는 딴소리를 늘어놓느니라.","서울 본집에 돌아가 보니, 수십 명의 권솔을 거느리고 가세가 풍부해서 무슨 연고인지 몰라서 물었더니, 나 모르게 춘이가 많은 재물을 보내 집과 전답(田畓)과 비복(婢僕)을 장만해 준 숨은 은덕(恩德)을 알았네.","가족들도 모두 자네의 호의를 고맙게 여기고 잘 지냈지만, 그전에 곤궁할 때에 수천 냥 빚을 얻어 썼더니, 그 빚쟁이들이 졸부가 되었다는 소문을 듣고 몰려들어 성화같이 재촉하지 않겠소.","그러니 양반의 체면으로 갚아 주지 않을 수 없어서 가장집물(家藏什物)을 모조리 팔아도 오히려 부족해서 또 다시 파산하고 과거도 보지 못하였으니, 참으로 춘이를 볼 낯이 없네, 이런 민망한 소리도 하기 싫어서 오지 않으려 하였으나, 그러면 배은망덕(背恩忘德)이라 오기는 하였네.","그러나 안 되는 놈은 자빠져도 코가 깨진다고, 도중의 주막에서 자다가 도적에게 노자와 의복을 모두 잃고 거지꼴이 되었으므로 춘이 보기가 무안하여, 아까 선뜻 들어오지 못하고 뜰에서 망설이고 있었으니, 이런 사정 알아주게.","원 서방님도 남 같은 소리를 하시네요.","사람이 일생을 살아가려면 무슨 일을 당하지 않으리이까.","그런 근심 걱정 아예 마셔요.","과거를 못 보신 것은 역시 운수입니다.","다음에 또 보실 수가 있으니 그것도 낙망(落望)하실 것 없나이다.","내 집에 서방님 드릴 옷이 없겠소, 밥이 없겠소?","그만한 일에 장부가 근심하면 큰일을 어찌하시리까?","하고, 위로하는 연연한 정이 측량할 수 없으니, 이튿날 옥단춘은 혈룡을 보고 뜻밖의 말하기를,","오늘은 또 이상한 날이에요.","평양 감사가 또 봄놀이로 연광정에서 잔치를 한다는 영이 내렸습니다.","내 아직 기생의 몸으로서 감사의 영을 거역하고 안 나갈 수 없으매, 서방님은 잠시 용서하시고 집에 계시면 속히 돌아오겠습니다.","하고, 옥단춘은 몸단장을 하고 교자를 타고 연광정 연회장으로 가니, 그 뒤에 이혈룡도 집을 나와서 비밀 수백한 역졸을 단속하고 연광정의 광경을 보려고 미행하여 가니라.","이때 평양 감사 김진희는 평안도 내의 각 읍의 수령을 모두 청하여 큰 연회를 배설(排設)하였는데, 그 기구가 호화찬란하고 진수성찬의 배반(杯盤)이 낭자하니라.","연광정의 주위는 봄볕이 모두 익어서 백화 만발하여 꽃동산이요, 잎은 피어서 청산이라, 갖은 새들도 요지연(瑤池宴)의 소식을 전하는 듯 쌍쌍이 날아들고 있었으니, 녹의홍상 수십 명의 기생의 가무 속에 풍악이 낭자하여 흥겨워 놀 적에, 암행어사 이혈룡은 찢어진 갓에 해진 옷을 떨치고 연광정 주위를 이리저리 거닐면서 연회장의 광경을 살폈는데, 남루한 의관과는 달리 의기는 양양하니라.","역졸들과 약속한 시각이 다가오자 이혈룡은 그 남루한 행색으로 성큼성큼 연광정 대상(臺上)으로 올라가니, 이때 당황한 나졸들이 와르르 달려와서 혈룡을 잡아서 층계 밑에 꿇려 놓으니, 김 감사가 대상에서 호통을 치니라.","너 이놈 이혈룡이로구나.","네가 저번에 죽지 않고 또 살아서 왔느냐?","이번에는 어디 견디어 보라!","나도 전번에 너를 친구라고 신세를 지려고 하였으나, 나도 양반의 자식이라.","이놈 진희야, 들어 보라.","머나먼 길에 너를 찾아 왔다가 영문에서 통기도 못하고 근근이 지내다가, 이 연광정에서 네가 놀고 있는 것을 보고 반가워하였으나, 너는 나를 미친놈이라고 대동강의 사공을 불러서 배에 태워 물 속에 던져서 죽이지 않았느냐.","내 물귀신 될 원혼이 오늘 또다시 네가 연광정에서 호유(豪遊)하기에 다시 보려고 왔다.","혈룡의 귀신이 원수를 갚으러 왔다는 위협에 김 감사도 등골이 섬뜩하여 좌우 비장(裨將)을 노려보며 어떻게 하랴 하고 물으니, 비장이,","아무래도 참말 같지 않사옵니다.","죽은 원혼이 어찌 사람 모습이 되어 올 수 있습니까?","그때 데리고 갔던 사공을 불러다가 문초(問招)하여 보시는 것이 좋을까 합니다.","하고, 사공을 빨리 잡아들이라는 영을 내리니, 나졸들이 청령(廳令)하고 나가서 잡아가면서 어르기를,","야단났다, 야단났다.","너희들 사공 놈들 야단났다.","어서 빨리 들어가자.","하고, 사공들의 덜미를 잡고 연광정 밑으로 가니,","사공 놈을 잡아왔소.","나졸들의 복명(復命)하는 소리가 산천에 진동하니라.","이 광경을 보고 있던 연회장의 옥단춘은 사공이 매에 못 이기고 사실대로 불어 대면 자기도 죄를 당할 것이고, 그보다 귀신 아닌 자기의 서방님 이생원이 능지처참(陵遲處斬)될 것을 생각하고 전신이 벌벌 떨렸으니, 김 감사는 형방을 불러서 형구(形具)를 차려 놓고,","그놈을 능지가 되도록 때려서 문초하라.","추상같은 엄명을 내리매, 형방조차 겁을 내고 뱃사공들을 치면서 얼러 대기를,","이놈들 들어 보라.","저번에 너희들은 저기 저 양반을 영대로 물에 던져 죽였느냐?","바른대로 고하라!","사공들은 악착같은 악형에 못 이기고 여차여차하였다고 사실대로 토설(吐說)하고 말았으니, 김 감사는 다른 형방에게,","저 이혈룡은 목을 베어 죽여도 죄가 남을 놈인데, 아까 형방놈은 내 앞에서 저놈을 양반이라고 불러서 존대하였으니, 그 형방 놈도 혈룡 놈과 죄가 같다!","하고, 먼저 형방을 잡아 꿇리고 분을 이기지 못하여 책상을 치면서 호통치기를,","전부터 내 수청도 거역한 요망스러운 기생년 옥단춘을 잡아내라!","좌우 나졸이 일시에 달려들어 소복 단장한 채로 분(粉)결같은 손목을 덥석 잡아서 끌어내리매, 연광정이 뒤집힐 듯이 살벌한 형장으로 일변하였으니, 평생에 이런 봉변을 만나 보지 않다가 오늘 이런 일을 당하자 수족을 벌벌 떨면서 이혈룡을 돌아보고,","여보시오, 이것이 웬일이오?","내가 그처럼 집을 보고 있으라고 신신당부하였는데 정말로 귀신이 되려고 여기 왔소?","무슨 살매가 들려서 죽을 곳을 찾아왔소?","내 집의 재물만으로도 호의호식 지낼 텐데 어찌하여 여기 와서 이 지경이 된단 말이오?","애고애고 우리 낭군 어찌하면 살 수 있소?","요전번에 죽을 목숨 살려 백년해로(百年偕老) 언약하고 즐겁게 살려 하였더니, 일년이 못 되어 이런 죽음 웬일이오?","애고애고 우리 낭군 야속하고 원통하오.","나는 지금 죽더라도 원통할 것 없건마는, 낭군님은 대장부로 생겨나서 공명 한 번 못 해보고 억울하게 황천객이 되면 얼마나 원통한 일이오.","아아, 낭군 팔자나 내 팔자나 전생의 무슨 죄로 이다지도 험악하단 말인가?","사주팔자(四柱八字)가 이럴진대 누구를 원망하겠소.","죽어도 같이 죽고 살아도 같이 살 우리이매, 저승에서 죽어도 후세에 다시 만나 이승에서 미진한 우리 정을 백년 다시 살아 보십시다.","임아 임아, 우리 낭군 어찌하여 살아날까?","아무리 원통해서 저승에 만나자고 빌어 봐도 지금 한 번 죽어지면 모든 것이 허사로다.","하며, 통곡하는 옥단춘의 정상을 누가 아니 슬퍼하랴.","그러나 이혈룡을 태연한 말로 옥단춘에게 다짐하니라.","춘아 춘아 내 사랑 옥단춘아, 너무 슬피 우지 마라.","네 울음 한 마디에 내 간장 다 녹는다.","내가 죽고 너 살거든 내 원수를 네가 갚고, 네가 죽고 내가 살면 네 원수를 내가 갚아 주마.","이때 김 감사가 사공들에게 호령하니라.","이혈룡과 옥단춘이 두 년 몸을 한배에 싣고 나 보는 앞에서 대동강 깊은 물에 던져 보리라!","네잇!","사공들이 저희들 목숨 산 것만 다행으로 여기고 물러나자, 김 감사는 또 영을 내려서 북소리를 세 번 덩덩덩 울리니,","그 연놈을 빨리 함께 죽여라!","하고, 아까 이혈룡을 양반이라고 부른 형방을 또다시 호령하니, 그 형리가 애걸하기를,","제 잘못은 과연 사또 앞에서 죽어 마땅하오나 다시는 그런 죄를지지 않겠으니 한 번만 용서하여 주십시오.","김 감사는 겨우 분을 풀고 그 형방을 용서하였으나, 이때 아직 신분을 밝히지 않은 암행어사 이혈룡이 사공들에게 묶여서 배에 실려 오를 적에 탄식하고 하는 말이,","붕우유신(朋友有信) 쓸데없고, 결의형제 쓸데없구나.","전에는 너와 내가 생사를 같이 하자고 태산처럼 맺었더니, 살리기는 고사하고 죄 없이 죽이기를 일삼으니 그럴 법이 어디 있나.","오륜(五倫)을 박대하면 앙화(殃禍)가 자손에까지 미치리라.","하고, 대동강의 맑은 물을 바라보며 한탄을 계속하니라.","대동강 맑은 물아, 너와 내가 무슨 원수로, 한 번 죽기도 억울한데, 두 번이나 죽이려고 이 모양을 시키느냐.","정말로 죽게 되면 가련하고 원통하다.","이때 옥단춘이 이혈룡의 손을 부여잡고 만경창파 바라보며 기절할 듯이,","원통하고 가련하다.","무죄한 우리 목숨 천명을 못 다 살고 어복중(魚復中)의 원혼 되니, 청천은 감동하사 무죄한 이 인생을 제발 살려 주소서.","하고 하늘에 호소할 때, 물에 던지기를 재촉하는 북소리가 한 번 울리니, 옥단춘은 더욱 기가 막히더라.","애고애고 이 일을 어찌할까?","임아 임아 낭군님아, 어찌 하면 산단 말고?","울지 마라 울지 마라, 죄 없으면 사느니라.","울지 말고 정신 차려라.","이때 북소리가 두 번 울리매, 춘이 자지러지게 놀라면서,","임아 임아 서방님아, 이제는 꼭 죽었지 못살겠소.","살려주소.","살려주소.","무죄한 이 소첩을 제발 살려주소.","신명께 맹세하여 아무 죄도 없습니다.","이때 세 번째 북소리가 들렸으니, 사공들은 당황히 재촉하니라.","어서 물에 들어가소.","일시라도 지체하면 우리 목숨 죽을 테니 어서 물로 들어가소.","하고 성화같이 재촉하니 옥단춘이 넋을 잃고,","여보 사공님들 들어보소.","당신들도 사람이면 무죄한 이 인생을 왜 그리 죽이려 하오?","나만은 자결할 테니, 우리 낭군 살려 주소.","아무리 야속해도 감사님 명령이 엄격하니, 살릴 묘책 없소이다.","어서 바삐 조처하소.","옥단춘은 단념하고 두 눈을 꼭 감고 치마를 걷어 올려서 머리에 쓰고 이를 갈면서 벌벌 떨고,","에구머니 나 죽는다!","한 마디 지르고 풍덩 뛰어들려고 하는 순간, 이혈룡이 깜짝 놀라서 옥단춘의 손을 부여잡고 가로되,","춘아 춘아, 죽어도 같이 죽고 살아도 같이 살자.","하고 잡아서 옆에 앉히고, 저쪽 연광정을 흘겨보면서,","얘들, 서리 역졸들아!","하고, 부르는 소리 천지를 진동하니, 난데없는 역졸들이 벌떼처럼 달려들며, 우뢰 같은 고함 소리와 함께,","암행어사 출도하옵시오!","하는 소리가 연광정과 대동강을 뒤엎을 듯하니라.","저기 가는 뱃사공아, 거기 타신 어사또님 놀라시지 않도록 고이 고이 잘 모셔라!","이때 암행어사 이혈룡이 비로소 배 안에서 일어서면서 사공에게 호령하기를,","이 배를 빨리 연광정으로 돌려 대라!","사공들은 귀신에 홀린 듯이 어찌할 바를 모르고 허둥지둥 배를 몰아 연광정 밑으로 대니, 옥단춘이 그때야 정신을 차리고 원망스러운 듯이,","임아 임아, 암행어사 서방님아, 이것이 꿈이런가, 만일에 꿈이라면 깰까 봐 걱정이오.","어사또가 옥단춘을 위로하며,","사람은 죽을 지경에 빠진 후에도 살아나는 법인데, 너 이런 재미 보았느냐.","하고 여유 있게 말하니, 옥단춘이 비로소 마음 턱 놓고 재담으로 대꾸하니라.","구중궁궐(九重宮闕) 아녀자가 어디 가서 보오리까.","어사또 출도하여 연광정에 좌정(坐定)하고 사방을 살펴보니, 오는 놈 가는 놈이 모두 넋을 잃고, 역졸에게 맞은 놈은 유혈이 낭자하다.","눈 빠진 놈, 코 깨진 놈, 머리 깨진 놈, 팔 부러진 놈, 다리 부러진 놈, 엎드러진 놈, 자빠진 놈이 오락가락 무수하다.","그중에서 각 읍의 수령들은 불의의 변을 당하고 겁낸 거동 가관이다.","칼집 쥐고 오줌 싸고 안장 없는 말을 타고, 개울로 빠져들고, 말을 거꾸로 타기도 하고, 동서를 분별하지 못하여 이리 저리 갈팡질팡 도망친다.","오다가 혼을 잃고 가다가 넋을 잃고 수라장으로 요란할 제, 평양 감사 김진희의 거동이 가장 볼만하니라.","김 감사는 수령들과 기생들을 거느리고 의기양양 노닐다가, 암행어사 출도 통에 혼비백산 달아날 제, 연광정 누다락의 높은 마루 밑에서 떨어져서 삼혼칠백(三魂七魄) 간 데 없고, 두 눈에 동자부채 벌써 떠나 멀리 가고, 청보에 똥을 싸고, 신발들메 하느라고 야단이라.","이때에 비장들이 달려들어 잡아 나꾸자, 어사또 그놈을 잡아내라고 추상같이 달려들어서 사지를 결박해서 어사또 앞으로 끌어다 엎어놓느니라.","너희들 들어라!","남의 막하에 있어 관장이 악한 정사를 하면 바른 길로 권할 것이지, 그렇지 않고 악한 짓을 권하니, 무죄한 백성이 어찌 편히 살며, 양반이 어찌 도의를 지킬 수 있겠느냐!","하는 호통을 하며, 형벌 제구를 내어놓고, 팔십 명 나졸 중에서 날랜 놈 십여 명을 골라서 형장을 잡히니라.","너희들, 매질에 사정 두면 명령 거역으로 죽을 줄 알아라.","엄명을 받은 용맹한 나졸들이 사정없이 볼기 육십 대씩 때려서 큰칼을 씌워서 옥에 가두고, 김 감사를 마지막으로 다스리니라.","서리 나졸들이 감사의 상투를 거머잡고 끌어내면서,","평양 감사 김진희 잡아 왔습니다.","하고, 복명하는 소리가 진동하니라.","너 김진희 오늘부터 파직한다.","어사또 이혈룡이 탐관의 벼슬을 탈하니, 공사로는 통쾌하나 사사로운 옛정을 생각하면 슬픈 마음 금할 수 없었으나 엄명을 받은 나졸들은 형구를 갖추고 형틀 위에 달아매었고, 팔십 명의 나졸과 서리 역졸이 좌우로 나열하여 어사또의 영을 기다리니, 형장(刑杖) 든 놈, 곤장(棍杖) 든 놈, 능장 든 놈, 태장 든 놈이 각각 형구를 뽐내며 팔을 걷어올리고 이를 악물고 벼르고 가로되,","여봐라 김진희야.","너는 나를 자세히 보라.","이 천하에 몹쓸 김진희야.","너와 내가 전일에 사생동거(死生同居)를 맹세하고 공부할 적에, 성은 서로 다를망정 대대로 친구의 두 집안이오.","서로의 정의가 동골동태(同骨同態)인들 어찌 그보다 더 친근하였으랴.","그 시절의 우리 맹세가 네가 먼저, 귀히 되면 나를 살게 해주고, 내가 먼저 귀히 되면 너를 살게 해 보자고 네 입으로 맹세하지 않았더냐.","마침 네가 먼저 등과(登科)하여 평양 감사가 되었으므로, 옛날에 맺은 태산 같은 언약을 생각하고 행여나 나를 도와줄까 하고 찾으려 하였으나 노자 한 푼 없어서 그것조차 마음대로 하지 못할 빈곤한 내 처지였는데, 그때 아내가 첫 근친 갈 때에 입었던 윗옷을 팔아 준 몇 푼을 가지고 너를 찾아 평양까지 걸어 왔으나, 네 높은 영문에서 내가 왔다는 통성명도 하지 못하고 여러 날을 묵새기다라, 방 값이 없어서 주막집에서도 쫓겨났으니, 그 뒤로 이리 저리 방황하다가 기갈이 심해서 입은 옷을 벗어 팔아서 밥을 사 먹은 것도 한 때 뿐 아니며, 거지꼴로 문전걸식 다닐 적에, 네가 마침 대동강에서 큰 잔치를 벌리고 호유한다는 소문을 듣고, 그날 너를 만나볼까 하고 찾았으나, 배반이 낭자하고 음식이 푸짐하고 풍악이 굉장할 제 굶주린 내 구미가 얼마나 동하였겠느냐.","네가 그때 남아 버리는 음식 조금만 주었으면 너도 생색나고 나도 좋을 것을, 너는 나를 미친놈이라고 사지를 묶어 배에 실어다가 대동강 물 속에 넣어 죽이려 한 것은 무슨 까닭이냐?","이 악독한 김진희 놈아, 바른대로 아뢰어라!","어사또의 호령이 내리자, 좌우의 나졸들이 벌떼같이 달려들어 번개같이 곤장 태장으로 두들겨 대며 가로되,","애고애고, 어사또님 제발 살려 주십시오.","제가 죽을죄를 진 것은 저도 모를 귀신이 시켜서 그랬사오니, 죽고 사는 것은 어사또 처분이오니, 죽을죄 지은 놈이 무슨 말씀하오리까.","처분만 바라오며 잔명을 비옵니다.","네 이놈, 나뿐 아니라, 죄 없는 옥단춘까지 나와 함께 죽이려 한 것은 무슨 까닭이냐?","네 죄를 생각하면 도저히 살려 둘 수 없다.","어사또는 여기서, 전에 자기를 배에 싣고 물에 넣으러 가던 사공들을 불러 놓고,","너희들 이 놈을 배에 싣고 대동강 깊은 물에 던져 버려라.","사공들이 어사또의 영을 듣고 김진희를 끌어다 배에 싣고 만경창파 물위로 떠나기 시작하니라.","이 때 어사또가 어진 마음으로 다시 생각하고 불쌍히 여겨서,","저 놈의 죄는 만 번 죽여도 부족하지만, 나로서 옛정을 생각하니 차마 죽일 수가 없구나.","하고 나졸을 불러서 분부하니라.","너희들 급히 매에 가서 그 양반을 물 속에 한참 넣었다가 거의 죽게 되었을 때에 도루 건져서 배에 싣고 오너라.","네잇.","하고, 나졸들이 강을 향하여 달려갈 적에, 별안간 뇌성벽력(雷聲霹靂)이 일어나더니 김진희를 벼락쳐서 시체도 없이 분쇄해 버렸다.","나졸들과 사공들이 돌아와서 김진희가 천벌의 벼락을 맞고 머리털 하나 찾아 볼 수 없게 되었다는 연유를 아뢰니, 이혈룡 어사또는 그래도 살려 주려 하였던 김진희가 천벌로 참혹하게 죽었다는 소식을 듣고 옛정을 생각하고 슬퍼하더라.","그 후에 김진희의 처자와 노비와 비장 등 여덟 명을 불러들여 위로하기를,","나는 진희를 참아 죽이지는 못하고 정배(定配)하려 하였으나 하늘이 괘씸히 여기시고 천벌을 내렸으니, 내 원망은 하지말라.","나도 실은 옛정을 생각하고 속으로 많이 울었는데, 기왕 죽은 사람은 할 수 없으니 남은 가족들은 마음을 진정하고 집으로 돌아가서 잘들 살아라.","하고, 각각 노자를 후하게 주어서 집으로 돌려보내니라.","평양 성안의 모든 사람들은 포악하던 김 감사의 천벌을 통쾌히 여기고, 또 이 어사또의 김 감사 유족에 대한 인정을 자자하게 칭찬하니라.","어사또가 김진희의 파직과 천벌의 경우를 상세히 기록하여 나라에 보고하자, 상감께서 들으시고 어사또의 처리를 칭찬하시고, 이때에 어사또가 상감이 주신 셋째 봉서를 뜯어보니 '암행어사 겸 평양 감사 이혈룡' 이라는 사령장이 들어 있었으매, 이혈룡은 천은을 배사(拜謝)하고 평양 감사로 도임하니라.","도임 후에 육방을 점고하고 각 읍 수령을 연명하고, 잔치를 베풀어 관방의 부하와 민간의 선비들을 초청하여 위로하니라.","그리고 옥단춘의 은혜를 치사하고, 뱃사공들에게도 각각 후한 상금을 주니라.","그리고 그날부터 어진 마음으로 치민치정(治民治定)을 잘 하였으므로 거리거리에 송덕비(頌德碑)가 여기저기 서니라.","이 감사는 칭찬을 받고 선정(善政)을 찬양하는 백성의 존경을 한 몸에 받게 되니라.","상감이 이 소문을 들으시고 크게 기뻐하셔서 곧 승차하여 우의정을 봉하시고, 대부인으로 충정부인을 봉하시고, 부인 김씨를 정렬부인으로 봉사하시고, 옥단춘으로 정덕부인을 봉하셨으니, 이로써 이혈룡이 일시에 부귀공명하고 국태민안(國泰民安)하니, 위엄과 세도가 나라에서 으뜸이라 만인이 칭찬하고 부러워하고 그 높은 명성이 천하에 빛나리라.","[앞부분 줄거리] 이혈룡과 김진희는 함께 공부하며 우정을 나눈 친구 사이였다. 김진희가 먼저 평양 감사가 되고, 가세가 기운 이혈룡은 유리걸식하다 평양 감사가 되었다는 김진희의 소식을 듣고 찾아간다. 그러나 김진희는 이혈룡을 괄시하며 대동강에 던지라고 사공에게 명한다. 이때 옥단춘이 이혈룡의 비범함을 알아보고 이혈룡을 구해 준다. 이혈룡은 자신을 구해 준 옥단춘과 연분을 맺고, 학업에 매진하여 암행어사가 되어 자신의 신분을 숨기고 돌아온다.","임아 임아 낭군님아, 이처럼 좋은 얼굴, 어쩌면 그 지경이 되어 왔소?","이렇게 옥단춘이 말하니, 이혈룡은,","서울 본집에 올라가 보니, 수십여 명의 권솔이 무슨 까닭인지 가세도 풍부하고 노비와 전답이 흡족하게 지내므로 그 연고를 물었더니, 그대가 재물을 많이 보내어 호의호식으로 지내는 것을 비로소 짐작하고 그대의 은혜가 백골난망인 것을 알았네. 가족들도 모두 자네의 호의를 고맙게 여기고 잘 지냈지만, 그전에 곤궁할 때에 수천 냥 빚을 얻어 썼더니, 그 빚쟁이들이 졸부가 되었다는 소문을 듣고 모여들어서 성화같이 빚 독촉을 하지 않겠나. 양반의 체면으로 갚지 않을 수 없어서 가정 기물을 모조리 팔아도 오히려 부족한지라. 그리하여 과거도 보지 못하였으니, 참으로 그대를 볼 낯이 없네. 이런 민망한 소리 하기 싫어서 오지 않으려 하였으나 그러면 배은망덕이 될 듯하여 오기는 하였네. 그러나 안 되는 놈은 자빠져도 코가 깨진다고, 도중의 주막에서 자다가 도적에게 노자와 의복을 모두 빼앗기고 거지꼴이 되어서 그대 보기가 무안하여 그리했었네.","라고 대답하였다. 옥단춘은 말을 받아,","사람이 일생을 살아가려면 무슨 일을 안 당하리까. 그런 근심 걱정일랑 아예 마세요. 과거를 못 보신 것은 역시 운수입니다. 다음에 또 보실 수가 있으니 그것도 낙망하실 것 없나이다. 내 집에 서방님 드릴 옷이 없겠어요? 밥이 없겠어요? 그만 일에 장부가 근심하면 큰일을 어찌하시리까.","하고 위로하니 연연한 정이 측량할 수 없었다.","이튿날 옥단춘은 혈룡에게 뜻밖의 말을 하였다.","오늘은 평양 감사가 봄놀이로 연광정에서 잔치를 한다는 영이 내렸습니다. 내 아직 기생의 몸으로서 감사의 영을 거역하고 안 나갈 수 없으니 서방님은 잠시 용서하시고 집에 계시면 속히 돌아오겠습니다.","말을 하고 난 후에 옥단춘은 연광정으로 나갔다.","그 뒤에 이혈룡도 집을 나와서 비밀 수배한 역졸을 단속하고 연광정의 광경을 보려고 내려갔다.","이때 평양 감사 김진희는 도내 각 읍의 수령을 모두 청하여 큰 잔치를 벌였는데, 그 기구가 호화찬란하고 진수성찬의 배반(杯盤)이 낭자하였다.","이때는 춘삼월 호시절이었다.","좌우 산천을 둘러보니 꽃이 피어 온통 꽃산이 되었고 나뭇잎은 피어서 온통 청산으로 변해 있었다.","맑은 강가의 버들가지엔 황금 같은 꾀꼬리가 날아들고 두견새, 접동새, 온갖 새들은 쌍쌍이 모여드는데, 말 잘하는 앵무새, 춤 잘 추는 학두루미, 요지 연못에 소식 전하던 청조새, 만첩청산에 홀로 앉아서 슬피 우는 두견새는 청천명월 깊은 밤에 이리 가며 뻐꾹, 저리 가며 뻐꾹뻐꾹 우는 그 소리가 몹시도 처량했다.","그 소리에 어사또는 심란하였다.","구경하는 사람들도 녹의홍상으로 곱게 입고 오락가락 다니면서 춘흥을 못 이겨 춤도 추고 노래도 따라 하며 놀았다.","이리저리 구경을 다한 어사또는 남루한 의관과는 달리 의기는 양양하였다.","역졸들과 약속한 시각이 다가오자 이혈룡은 그 남루한 행색으로 성큼성큼 연광정 대상(臺上)으로 올라가려 하였다.","그러자 당황한 나졸들이 와르르 달려와서 덜미를 잡아 끌어내며,","이 미친놈아, 이 자리가 어느 안전이라고 함부로 올라가려 하느냐!","하고 호통을 치며 혹심하게 구박했다.","그러니 어사또는 헌 파립 헌 의복이 모두 떨어져서 알몸이 보이게 되었다.","이에 화가 치민 이혈룡은 김 감사의 이름을 부르며 큰 소리로,","네 이놈 김진희야, 나 이혈룡을 모른단 말이냐?","하고 호통을 쳤다.","이 소리에 옥단춘이 깜짝 놀라 살펴보니 음성은 혈룡 서방의 음성이나 의복이 달랐다.","이혈룡의 말을 김 감사가 듣고 크게 노하여 이혈룡을 잡아들이라는 소리가 천지를 진동할 듯하였다.","김 감사의 영을 받은 나졸들이 와르르 달려들어 이혈룡의 풀어진 상투를 휘휘 칭칭 감아쥐고 뺨도 때리고 등도 밀치고 재빠르게 잡아들여 층계 아래에 엎쳐 놓았다.","(중략)","이혈룡이 탄식하면서 하는 말이,","붕우유신(朋友有信) 쓸데없고, 결의형제 쓸데없다. 전에 너와 내가 생사를 같이하자고 태산같이 맺은 언약 철석같이 맺었더니, 살리기는 고사하고 죄 없이 죽이기를 일삼으니 무심하고 야속하다. 오륜을 박대하면 앙화가 자손에게까지 미치리라.","하였다.","이혈룡이 대동강의 맑은 물을 바라보며 큰 소리로 한탄하였다.","대동강 맑은 물아, 너와 내가 무슨 원수로, 한 번 죽기도 어려운데 두 번이나 죽이려고 이 모양을 시키느냐. 정말로 죽게 되면 가련하고 원통하다.","이때에 옥단춘이 이혈룡의 손을 부여잡고 만경창파 바라보고 애통해하며,","원통하고 가련하다. 죄 없는 목숨 천명을 못다 살고 어복중의 원혼 되니, 명천은 감동하사 무죄한 이 인생을 제발 덕분 살려 주소서.","하고 수없이 통곡하였다.","그때 물에 던지기를 재촉하는 북소리가 한 번 울렸다.","옥단춘은 더욱 기가 막혀,","애고애고 이 일을 어찌할까. 임아 임아 낭군님아, 어찌하면 산단 말이오?","하고 울부짖자 이혈룡이 옥단춘을 달래며,","울지 마라 울지 마라, 죄 없으면 사느니라. 울지 말고 진정하여라.","하고 말했다.","이때 북소리가 두 번째 울렸다.","옥단춘이 또 자지러지게 놀라면서,","임아 임아 서방님아, 이제는 죽는구려. 살려 주오 살려 주오. 무죄한 이 소첩을 제발 덕분 살려 주오. 맹세코 아무 죄도 없습니다.","하고 통곡할 때 세 번째 북소리가 들렸다.","그러자 사공들은 황급히 재촉하기를,","어서 물에 들어가소. 일시라도 지체하면 우리 목숨이 죽을 테니 어서 들어가소.","하고 성화같이 독촉하였다.","옥단춘이 넋을 잃고 사공들에게 애걸하며","여보 사공님들 들어 보소. 당신들도 사람인데 죄 없는 우리 인생을 왜 그리 무고하게 우리를 죽이려 하오. 나만은 자결할 테니 우리 낭군 살려 주소.","하였다.","그러자 사공들이 대답하기를,","아무리 야속해도 감사님 명령이 지엄하시니 살릴 묘책이 없소이다. 어서 바삐 조처하소.","하였다.","옥단춘은 단념하고 하는 수 없이 두 눈을 꼭 감고 치마를 걷어 올려서 머리에 쓰고 이를 박박 갈고 벌벌 떨면서,","애고머니 나 죽는다!","한마디 지르고는 풍덩 뛰어들려고 하는 순간이었다.","이혈룡이 깜짝 놀라서 옥단춘의 손을 부여잡고 하는 말이,","죽어도 같이 죽고 살아도 같이 살자.","하고 잡아서 옆에 앉히고 저쪽 연광정을 건너다보면서,","얘들, 서리 역졸들아! 어디 갔느냐?","하고 소리치는데 그 소리 천지를 진동할 듯하였다.","그러자 난데없는 역졸들이 벌떼처럼 내달으며 달과 같은 마패를 일월(日月)같이 치켜들고 우레와 같은 큰 소리를 벽력같이 지르면서,","암행어사 출두요! 암행어사 출두요!"]);
const EBSSET=new Set(["[앞부분 줄거리] 이혈룡과 김진희는 함께 공부하며 우정을 나눈 친구 사이였다. 김진희가 먼저 평양 감사가 되고, 가세가 기운 이혈룡은 유리걸식하다 평양 감사가 되었다는 김진희의 소식을 듣고 찾아간다. 그러나 김진희는 이혈룡을 괄시하며 대동강에 던지라고 사공에게 명한다. 이때 옥단춘이 이혈룡의 비범함을 알아보고 이혈룡을 구해 준다. 이혈룡은 자신을 구해 준 옥단춘과 연분을 맺고, 학업에 매진하여 암행어사가 되어 자신의 신분을 숨기고 돌아온다.","임아 임아 낭군님아, 이처럼 좋은 얼굴, 어쩌면 그 지경이 되어 왔소?","이렇게 옥단춘이 말하니, 이혈룡은,","서울 본집에 올라가 보니, 수십여 명의 권솔이 무슨 까닭인지 가세도 풍부하고 노비와 전답이 흡족하게 지내므로 그 연고를 물었더니, 그대가 재물을 많이 보내어 호의호식으로 지내는 것을 비로소 짐작하고 그대의 은혜가 백골난망인 것을 알았네. 가족들도 모두 자네의 호의를 고맙게 여기고 잘 지냈지만, 그전에 곤궁할 때에 수천 냥 빚을 얻어 썼더니, 그 빚쟁이들이 졸부가 되었다는 소문을 듣고 모여들어서 성화같이 빚 독촉을 하지 않겠나. 양반의 체면으로 갚지 않을 수 없어서 가정 기물을 모조리 팔아도 오히려 부족한지라. 그리하여 과거도 보지 못하였으니, 참으로 그대를 볼 낯이 없네. 이런 민망한 소리 하기 싫어서 오지 않으려 하였으나 그러면 배은망덕이 될 듯하여 오기는 하였네. 그러나 안 되는 놈은 자빠져도 코가 깨진다고, 도중의 주막에서 자다가 도적에게 노자와 의복을 모두 빼앗기고 거지꼴이 되어서 그대 보기가 무안하여 그리했었네.","라고 대답하였다. 옥단춘은 말을 받아,","사람이 일생을 살아가려면 무슨 일을 안 당하리까. 그런 근심 걱정일랑 아예 마세요. 과거를 못 보신 것은 역시 운수입니다. 다음에 또 보실 수가 있으니 그것도 낙망하실 것 없나이다. 내 집에 서방님 드릴 옷이 없겠어요? 밥이 없겠어요? 그만 일에 장부가 근심하면 큰일을 어찌하시리까.","하고 위로하니 연연한 정이 측량할 수 없었다.","이튿날 옥단춘은 혈룡에게 뜻밖의 말을 하였다.","오늘은 평양 감사가 봄놀이로 연광정에서 잔치를 한다는 영이 내렸습니다. 내 아직 기생의 몸으로서 감사의 영을 거역하고 안 나갈 수 없으니 서방님은 잠시 용서하시고 집에 계시면 속히 돌아오겠습니다.","말을 하고 난 후에 옥단춘은 연광정으로 나갔다.","그 뒤에 이혈룡도 집을 나와서 비밀 수배한 역졸을 단속하고 연광정의 광경을 보려고 내려갔다.","이때 평양 감사 김진희는 도내 각 읍의 수령을 모두 청하여 큰 잔치를 벌였는데, 그 기구가 호화찬란하고 진수성찬의 배반(杯盤)이 낭자하였다.","이때는 춘삼월 호시절이었다.","좌우 산천을 둘러보니 꽃이 피어 온통 꽃산이 되었고 나뭇잎은 피어서 온통 청산으로 변해 있었다.","맑은 강가의 버들가지엔 황금 같은 꾀꼬리가 날아들고 두견새, 접동새, 온갖 새들은 쌍쌍이 모여드는데, 말 잘하는 앵무새, 춤 잘 추는 학두루미, 요지 연못에 소식 전하던 청조새, 만첩청산에 홀로 앉아서 슬피 우는 두견새는 청천명월 깊은 밤에 이리 가며 뻐꾹, 저리 가며 뻐꾹뻐꾹 우는 그 소리가 몹시도 처량했다.","그 소리에 어사또는 심란하였다.","구경하는 사람들도 녹의홍상으로 곱게 입고 오락가락 다니면서 춘흥을 못 이겨 춤도 추고 노래도 따라 하며 놀았다.","이리저리 구경을 다한 어사또는 남루한 의관과는 달리 의기는 양양하였다.","역졸들과 약속한 시각이 다가오자 이혈룡은 그 남루한 행색으로 성큼성큼 연광정 대상(臺上)으로 올라가려 하였다.","그러자 당황한 나졸들이 와르르 달려와서 덜미를 잡아 끌어내며,","이 미친놈아, 이 자리가 어느 안전이라고 함부로 올라가려 하느냐!","하고 호통을 치며 혹심하게 구박했다.","그러니 어사또는 헌 파립 헌 의복이 모두 떨어져서 알몸이 보이게 되었다.","이에 화가 치민 이혈룡은 김 감사의 이름을 부르며 큰 소리로,","네 이놈 김진희야, 나 이혈룡을 모른단 말이냐?","하고 호통을 쳤다.","이 소리에 옥단춘이 깜짝 놀라 살펴보니 음성은 혈룡 서방의 음성이나 의복이 달랐다.","이혈룡의 말을 김 감사가 듣고 크게 노하여 이혈룡을 잡아들이라는 소리가 천지를 진동할 듯하였다.","김 감사의 영을 받은 나졸들이 와르르 달려들어 이혈룡의 풀어진 상투를 휘휘 칭칭 감아쥐고 뺨도 때리고 등도 밀치고 재빠르게 잡아들여 층계 아래에 엎쳐 놓았다.","(중략)","이혈룡이 탄식하면서 하는 말이,","붕우유신(朋友有信) 쓸데없고, 결의형제 쓸데없다. 전에 너와 내가 생사를 같이하자고 태산같이 맺은 언약 철석같이 맺었더니, 살리기는 고사하고 죄 없이 죽이기를 일삼으니 무심하고 야속하다. 오륜을 박대하면 앙화가 자손에게까지 미치리라.","하였다.","이혈룡이 대동강의 맑은 물을 바라보며 큰 소리로 한탄하였다.","대동강 맑은 물아, 너와 내가 무슨 원수로, 한 번 죽기도 어려운데 두 번이나 죽이려고 이 모양을 시키느냐. 정말로 죽게 되면 가련하고 원통하다.","이때에 옥단춘이 이혈룡의 손을 부여잡고 만경창파 바라보고 애통해하며,","원통하고 가련하다. 죄 없는 목숨 천명을 못다 살고 어복중의 원혼 되니, 명천은 감동하사 무죄한 이 인생을 제발 덕분 살려 주소서.","하고 수없이 통곡하였다.","그때 물에 던지기를 재촉하는 북소리가 한 번 울렸다.","옥단춘은 더욱 기가 막혀,","애고애고 이 일을 어찌할까. 임아 임아 낭군님아, 어찌하면 산단 말이오?","하고 울부짖자 이혈룡이 옥단춘을 달래며,","울지 마라 울지 마라, 죄 없으면 사느니라. 울지 말고 진정하여라.","하고 말했다.","이때 북소리가 두 번째 울렸다.","옥단춘이 또 자지러지게 놀라면서,","임아 임아 서방님아, 이제는 죽는구려. 살려 주오 살려 주오. 무죄한 이 소첩을 제발 덕분 살려 주오. 맹세코 아무 죄도 없습니다.","하고 통곡할 때 세 번째 북소리가 들렸다.","그러자 사공들은 황급히 재촉하기를,","어서 물에 들어가소. 일시라도 지체하면 우리 목숨이 죽을 테니 어서 들어가소.","하고 성화같이 독촉하였다.","옥단춘이 넋을 잃고 사공들에게 애걸하며","여보 사공님들 들어 보소. 당신들도 사람인데 죄 없는 우리 인생을 왜 그리 무고하게 우리를 죽이려 하오. 나만은 자결할 테니 우리 낭군 살려 주소.","하였다.","그러자 사공들이 대답하기를,","아무리 야속해도 감사님 명령이 지엄하시니 살릴 묘책이 없소이다. 어서 바삐 조처하소.","하였다.","옥단춘은 단념하고 하는 수 없이 두 눈을 꼭 감고 치마를 걷어 올려서 머리에 쓰고 이를 박박 갈고 벌벌 떨면서,","애고머니 나 죽는다!","한마디 지르고는 풍덩 뛰어들려고 하는 순간이었다.","이혈룡이 깜짝 놀라서 옥단춘의 손을 부여잡고 하는 말이,","죽어도 같이 죽고 살아도 같이 살자.","하고 잡아서 옆에 앉히고 저쪽 연광정을 건너다보면서,","얘들, 서리 역졸들아! 어디 갔느냐?","하고 소리치는데 그 소리 천지를 진동할 듯하였다.","그러자 난데없는 역졸들이 벌떼처럼 내달으며 달과 같은 마패를 일월(日月)같이 치켜들고 우레와 같은 큰 소리를 벽력같이 지르면서,","암행어사 출두요! 암행어사 출두요!"]);

  const p=G.player;if(p.moving||G.lock)return;const [dx,dy]=DIRV[p.dir];const x=p.tx+dx,y=p.ty+dy;
  const n=G.map.npcs.find(n=>visible(n)&&n.tx===x&&n.ty===y);

  const o=G.map.objs.find(o=>o.use&&!(o.hide&&o.hide())&&x>=o.x&&x<o.x+o.w&&y>=o.y&&y<o.y+o.h);

function orderPuzzle(title,ev){

  });
}

/* 장구: 덩(양편), 쿵(북편), 덕(채편), 기덕 */

/* 장단과 음계 */
const JANG={
  gut:{n:12,hits:{0:"덩",2:"기덕",3:"쿵",5:"덕",6:"쿵",8:"덕",9:"쿵",11:"기덕"}},
  sema:{n:9,hits:{0:"덩",3:"덩",4:"덕",6:"쿵",7:"덕"}},
  jin:{n:12,hits:{0:"쿵",6:"덕",9:"쿵"}},
  hwi:{n:8,hits:{0:"덩",2:"덕",3:"덕",4:"쿵",6:"덕",7:"기덕"}}
};
const MOODS={
  title:{base:293.66,scale:[0,2,5,7,9],jang:"jin",eighth:0.36,lead:"flute",vol:0.85,seed:3},
  hanyang:{base:293.66,scale:[0,2,5,7,9],jang:"gut",eighth:0.24,lead:"pluck",vol:0.85,seed:7},
  pyong:{base:392,scale:[0,2,5,7,9],jang:"sema",eighth:0.17,lead:"pluck",vol:0.8,seed:11},

  trial:{base:146.83,scale:[0,3,5,7,10],jang:"hwi",eighth:0.15,lead:"haegeum",vol:0.85,seed:13},
  home:{base:261.63,scale:[0,2,5,7,9],jang:"gut",eighth:0.33,lead:"flute",vol:0.75,seed:17}

function makeSong(m){
  let s=m.seed*9301+49297;const rnd=()=>(s=(s*9301+49297)%233280)/233280;
  const J=JANG[m.jang],bars=8,notes=[];let idx=5;
  for(let b=0;b<bars;b++){let p=0;const end=b%4===3;
    while(p<J.n){let len=[1,2,2,3,3][Math.floor(rnd()*5)];if(end&&p>=J.n-4){len=J.n-p}
      if(rnd()<(m.lead==="flute"?0.35:0.18)&&!end){p+=len;continue}
      idx+=[-2,-1,-1,1,1,2,0][Math.floor(rnd()*7)];if(end&&p+len>=J.n)idx=b===bars-1?5:7;idx=Math.max(0,Math.min(10,idx));

function degFreq(m,deg){const sc=m.scale,oct=Math.floor(deg/5),k=((deg%5)+5)%5;return m.base*Math.pow(2,(sc[k]+12*oct)/12)*0.5}

    const i=AU.step%AU.song.total,t=AU.next,pos=i%J.n,h=J.hits[pos];
    if(h){if(h==="기덕"){gDrum("기",t,0.28);gDrum("덕",t+m.eighth*0.5,0.3)}else gDrum(h,t,h==="덩"||h==="쿵"?0.55:0.32)}

function setMood(name){

const SFXVOL={clop:3,give:6,swish:5,clang:5,slash:5,roar:4,thunder:3,boom:3,crackle:3,fire:4,wind:4.5,howl:2.5,hoof:3.2,drum:3,arrow:6,cheer:5,chop:3.5,pop:5,magic:6,thud:3.5,crane:6,brush:8,gulp:4,heal:6,grow:5,shrink:5,jingle:7,slap:5,blip:20,click:18,step:40,page:10,tip:7.5,stitch:14,bubble:13,pull:24,coin:4.6,gain:5,correct:5.5,wrong:15,whack:3.2,gong:1.9,poof:9,splash:5.5,stamp:5.5};

  opt=opt||{};
  const hit=G.map.npcs.find(x=>(x.look==="sar"||x.look==="guard")&&x!==target&&visible(x));let back=null;
  if(hit){back=[hit.tx,hit.ty,hit.dir];G.flash=0;setNear(hit,[[target.tx-1,target.ty],[target.tx+1,target.ty],[target.tx-1,target.ty+1],[target.tx+1,target.ty+1]]);hit.dir=hit.tx<target.tx?"r":"l";hit.fixed=1;await sleep(250)}
  for(let i=0;i<n;i++){
    const t0=performance.now()/1000;FX.push({k:"paddle",e:target,t0,dur:0.42,count:(opt.from||0)+i+1,tool:opt.tool});
    await sleep(210);sfx(opt.sfx||"whack");G.shake=Math.max(G.shake||0,opt.hard?5:3.5);target.hurt=0.35;
    FX.push({k:"hit",e:target,t0:performance.now()/1000,dur:0.5,count:(opt.from||0)+i+1});

function drawFX(t){
  const cx=G.cam.x,cy=G.cam.y;
  for(let i=FX.length-1;i>=0;i--){const f=FX[i],p=(t-f.t0)/f.dur;if(p>1.2){FX.splice(i,1);continue}if(p<0)continue;
    const [px,py]=entPos(f.e),sx=Math.round(px-cx),sy=Math.round(py-cy);
    if(f.k==="fly"){const [qx,qy]=entPos(f.to),q=Math.min(1,p);if(p<1.02)drawHeldIcon(f.id,sx+8+(qx-px)*q,sy-2+(qy-py)*q-Math.sin(Math.PI*q)*18,t);continue}
    if(f.k==="paddle"&&f.tool){const a=0.5-Math.min(1,p*1.9)*2.0;ctx.save();ctx.translate(sx+25,sy+3);ctx.rotate(a);ctx.scale(1.5,1.5);drawHeldIcon(f.tool,0,0,t);ctx.restore()}
    else if(f.k==="paddle"){const a=-1.7+Math.min(1,p*1.9)*2.3;ctx.save();ctx.translate(sx+26,sy-30);ctx.rotate(a);
      ctx.fillStyle="#1d1813";ctx.fillRect(-4,-1,8,40);ctx.fillStyle="#6d4b2c";ctx.fillRect(-2,0,4,14);ctx.fillStyle="#a07a4c";ctx.fillRect(-3,14,6,24);ctx.fillStyle="#c49a64";ctx.fillRect(-2,15,1,22);ctx.restore()}
    if(f.k==="hit"&&p<1){const r=4+p*10,al=1-p;ctx.globalAlpha=al;ctx.fillStyle="#fff6c8";
      for(let k=0;k<8;k++){const an=k*Math.PI/4+0.3;ctx.fillRect(Math.round(sx+8+Math.cos(an)*r)-1,Math.round(sy-2+Math.sin(an)*r)-1,2,2)}
      ctx.fillStyle="#e0493a";ctx.fillRect(sx+6,sy-4,4,4);ctx.globalAlpha=1}
  }
}

  await S([...nn("방안으로 들어가니 분벽사창(粉壁紗窓)이 찬란하니라.","좌우를 둘러보니, 천하 명화의 좋은 그림이 여기저기 걸렸는데, 위수(渭水)의 강태공이 문왕을 기다리며 곧은 낚시를 물에 던지고 어엿이 앉아 있는 모양이 완연하더라.","또 다른 그림에는 시중천자(時中天子) 이태백이 채석강 밝은 포도주를 취하게 먹고 물 속에 비친 달을 잡으려고 넌지시 손을 넣는 광경이 역력하며, 또 저편 벽에는 한나라 종실의 유황숙이 와룡 선생 제갈량을 맞으려고 남양(南洋)땅의 초당으로 풍설 속에 적토마(赤免馬)를 빗겨 타고 지향 없이 가는 정경이 선명하며, 또 한편에는 산중서차인 두 노인이 한가롭게 앉은 모양이 신전의 경지를 보이며, 또 다른 그림에는 상상사호(常常四豪) 네 노인이 바둑판을 앞에 놓고 흑백을 희롱하며, 그리고 대동강의 좋은 풍경을 그린 그림도 여기 저기 걸려 있더라.")]);trait("list");
  holdSet(n,"cup");await S([...nn("옥단춘은 주안상을 들여놓고, 향기 높은 계자조를 유리잔에 가득 부어 들고 권주가를 한 가락 부르면서 이혈룡에게 권하는데,")]);await give(n,me(),"cup");
  await S([...qq("C",0,"일배 일배 부인배의 보통 술이 아니오라, 한무제 승로반(承露盤)에 옥로(玉露) 받은 술이오니, 이 술 한잔 잡수시면 천만년을 사시리라.","전에 한번 몸 뵈었으나 내일 보면 구면이니 사양 말고 잡수시오."),...nn("이생원 한 두 잔 먹는 사이에 어느덧 취하여 취중에 가로되,"),...qq("H",0,"하아, 지난 일을 생각하니 세상사가 허무(虛無)로다.","천만 무궁한 이 자리의 흥취(興趣)를 어찌 다 말하리요."),...nn("하고, 밤 가는 줄도 모르며 옥단춘의 환대를 받았으니, 그 뒤로 이생원은 옥단춘의 집에서 신세를 지게 되니라.")]);trait("song");holdDel(me(),"cup");
  await card("세월이 흘러","과거 소식","왕실에 세자가 태어나, 나라에서 과거를 보인다고 한다.");
  await S([...nn("이럭저럭 세월이 흘러서 왕실에 세자(世子)가 탄생하자, 나라의 경사를 축하하여 태평과(太平科)의 과거를 보인다는 소문을 들은 옥단춘이 기뻐하고 이혈룡에게 권하여 말하기를,"),...qq("C",0,"과거 보인다는 소식이 들리니, 낭군은 과거를 보러 상격하십시오.","충신의 후손으로서 이런 기회를 어찌 허송하겠습니까?"),...qq("H",0,"그대 말이 당연하나 늙으신 모친이 내가 오늘 올까 내일 올까 하고 기다리시면서, 초조하게 간장을 녹이고 계신 것을 생각하면, 오늘까지 이렇게 편히 지낸 일이 불효임을 어찌 모르리오.","그러나 이 꼴로 서울 가서 무슨 면목으로 노모와 처자를 대하리오."),...nn("하고, 탄식하는 그의 두 눈에서 눈물이 주르르 흐르니, 옥단춘이 거듭 위로하면서,"),...qq("C",0,"과거를 힘써 봐서 입신양명(立身揚名)하온 후에 영화를 볼 것이니 너무 상심 마시고 속히 상경(上京)하십시오."),...nn("하고, 행장을 수습하여 주면서 신신당부하니라.")]);
  holdSet(n,"bundle");await give(n,me(),"bundle");
  await S([...qq("C",0,"이 길로 상경하시되, 새문밖 경기 감영 앞의 이섬부 댁을 찾아가십시오.","그 댁에 제가 부탁할 말씀도 있고, 제 하인도 그 댁에 있으니, 그 하인을 데리시고 과장(科場)에 나아가십시오.","이제 이별하오나, 후일 다시 만날 것이니, 조금도 섭섭히 생각하지 마시고 잘 가셔서 장원급제로 입신양명하신 후에 북당(北堂) 기후(氣候) 안녕하거든 다시 돌아와 주십시오.")]);holdSet(n,"letter");await give(n,me(),"letter");

  await S([...nn("이혈룡은 옥단춘의 애정과 격려를 힘으로 서울로 돌아와서, 우선 새문 밖의 이섬부 집을 찾아 가니라.","옥단춘의 편지를 전하고 하인의 인도로 대문에 들어서니, 고대광실(高臺廣室)은 아닐망정 집이 정결하고, 소실대문의 별배(別陪)들이 굽실굽실 문안하고 내정(內庭)으로 모셔 드리니라.")]);await give(me(),N("sv"),"letter");

  await vanish(N("sv"));setObj("안으로 들어가 모친에게 가자 ↑");
}
async function h3Mom(){

  await S([...nn("곧 모친 앞에 엎드려서 통곡하면서 우선 사죄하니라."),...qq("H",0,"불효자 혈룡이 이제야 돌아왔사옵니다.","어머님은 그동안 안녕하셨습니까?","불효의 이 자식을 생각하며 얼마나 기다리셨습니까?"),...nn("모친도 아들의 뜻밖의 태도에 놀란 듯이 혈룡의 손을 잡고 슬피 울며 가로되,"),...qq("mom",0,"혈룡아, 너는 충신의 아들이라 효성이 이렇게 지극하구나.","네가 평양에 간 후에 근근이 지내던 중, 너의 친구 평양 감사가 보내 주신 재물로 가세가 이만큼 요부(饒富)해져서 노비와 전답을 많이 샀으니, 만년(晩年)의 재미를 보며 편하다.","오직 네가 빨리 오기만 기다렸더니 이제 왔으니 참으로 새 세상 만난 것 같이 기쁘다.","인제는 죽어도 하릴없다.","그래 너는 객지에서 얼마나 고생하였느냐?"),...nn("하고 기뻐하니라.")]);

  await S([...qq("H",0,"당신은 모친 모시고 얼마나 고생하였소?"),...qq("wife",0,"저는 서방님 덕택으로 잔명(殘命)을 보존하였으니, 고맙소이다.","그런데 이처럼 후한 우정으로 우리를 살려 주신 평양 감사님 은혜를 어찌 갚을지 모르겠습니다."),...nn("혈룡은 마지못해 평양 간 후의 모든 일을 사실대로 알리자 모친과 아내가, 혈룡이 죽을 고생을 생각하면서 하마터면 생전에 다시 만나 보지 못할 경우를 새삼스럽게 슬퍼하니라.","그와 동시에 옥단춘의 은혜를 치하하여 마지않더라.","오랜만에 만난 가족들은 다시 원만한 가정을 이루게 되니, 이윽고 과것날이 되었으므로 이혈룡은 대궐 안 과거장으로 가서 본즉, 팔도에서 글 잘하는 선비들이 구름같이 모여들어 입신양명의 영예를 다투려고 투지가 장내에 넘치니라.")]);

  await card("과것날","대궐 안 과거장","팔도에서 글 잘하는 선비들이 구름같이 모여들었다.","s5");
  await timing(1,{eb:"과거",title:"단숨에 써 내려가기",desc:"붓이 붉은 칸 안에 들어왔을 때 누르세요."});
  await S([...nn("이윽고 걸린 글제 보니 '천하태평춘(天下泰平春)'이라 하였으매, 글을 지을 생각을 가다듬으면서 먹을 간 혈룡은, 붓을 들어서 조맹부의 필체로 단숨에 내려 써서 맨 먼저 올리니, 시관(試官)들을 거느리고 친히 보시던 상감은 글자마다 비점(批點)이오 글귀마다 관주(貫珠)로 꼬누어진 글을 보고 칭찬하시는 말씀이,"),...qq("king",0,"참으로 신기하다.","이 글씨와 글 지은 사람은 반드시 범상치 않으리라."),...nn("하시고, 알성급제(謁聖及第) 도장원(都壯元)으로 한림학사(翰林學士)를 제수하시고, 곧 어전입시(御前入侍)하라는 분부를 내리시고, 이한림이 입시하여 천은을 사례하자 상감이 칭찬하고 손수 술잔을 내리시니, 이한림이 어전에 엎드리고,"),...qq("H",0,"소신과 같이 무재무능(無才無能)한 자를 이처럼 중신(重信)하려고 칭찬하시오니 황공무지하오며, 또한 한림을 제수하시니 더욱 황공하옵니다."),...nn("하고, 물러나와 집에 큰 잔치를 베풀고 향당과 친지를 청하여 경사를 축하하니라.","그리고 한편으로 생각하니,"),...tt("H","평양 감사 김진희의 불의 무도한 소행을 나만 당하였으랴.","무죄한 백성들을 무슨 죄목에 걸어서는 행악(行惡)을 하고 수탈에 여념이 없을 것이라.","그 한 명의 흉측한 어복(魚腹)에 평안일도(平安一道)가 희생되는 것을 알면서 어찌 모른 척할 수 있으랴.","나라와 백성을 위하여 마땅히 성상께 여쭙지 않을 수 없다."),...nn("하고, 전후 사실을 일일이 밀록(密錄)해 전하께 바치니, 전하가 받아 보시고 탄식한 뒤에 봉서(封書) 삼장을 내리시니,")]);holdSet(me(),null);
  tip("혈룡은 제 원한만 말하지 않아요. 진희 한 사람 때문에 평안도 백성이 겪을 일을 걱정해서 임금께 아뢰어요.");
  await S([...qq("king",0,"첫 봉서는 새문 밖에 가서 떼어 보고, 둘째 봉서는 평양에 가서 떼어 보고, 셋째 봉서는 그 후에 떼어 보라.","그리고 도중에 조심하여 다녀오라.")]);await getItem("bongseo");holdSet(me(),"bongseo");meet("s_bongseo");
  await S([...nn("하는 비밀 지령을 주시리라.")]);
  await quiz("hpoor","첫 봉서는 어디에서 떼어 보라고 했나?",["대궐 안에서 바로","새문 밖에 가서","평양에 가서"],1,"상감의 말을 다시 떠올려 보세요. 봉서마다 떼어 볼 곳이 달랐어요.");
  await S([...nn("이한림이 곧 모친과 부인에게 하직하고 새문 밖에 나가서 첫째 봉서를 떼어 보니, '평안도 암행어사 이혈룡' 이라는 사령장이 들어 있더라.","거기서 비로소 수의를 입고 마패(馬牌)를 찬 후에, 평안도로 급히 출동해 가니라.")]);await getItem("mapae");holdSet(me(),["bongseo","mapae"]);meet("s_mapae");
  tip("봉서는 세 장이에요. 첫째가 암행어사 임명이었어요. 둘째와 셋째에 무엇이 들었는지는 그때 가서 열려요.");
